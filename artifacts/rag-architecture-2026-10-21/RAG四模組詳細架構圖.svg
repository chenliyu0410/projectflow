<text x="195" y="1031" font-size="22" font-weight="400" fill="#B3C7D3" text-anchor="start">權限由後端依登入身分確認；開啟原文仍須授權。介面名稱為建議契約，不代表現有 API 路徑。</text>
<text x="195" y="1063" font-size="21" font-weight="400" fill="#B3C7D3" text-anchor="start">規劃範圍：向量與正式附件索引待建置；第一版不含 OCR。圖示為邏輯模組，可共用同一後端部署。</text></g></svg>