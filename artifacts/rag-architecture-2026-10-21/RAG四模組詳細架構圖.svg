<text x="100" y="303" font-size="25" font-weight="700" fill="#51D8C6" text-anchor="start">解析清理</text>
<text x="260" y="303" font-size="25" font-weight="400" fill="#F5F8FA" text-anchor="start">文字型 PDF／DOCX／TXT</text>
<text x="100" y="338" font-size="25" font-weight="700" fill="#51D8C6" text-anchor="start">切塊策略</text>
<text x="260" y="338" font-size="25" font-weight="400" fill="#F5F8FA" text-anchor="start">依章節、段落及長度分段</text>
