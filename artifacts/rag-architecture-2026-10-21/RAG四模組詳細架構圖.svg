<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">RAG 四模組責任與資料流架構</title><desc id="desc">A 資料整理交付 B 索引。D 使用者介面將問題交付 C 生成，C 向 B 檢索，取得證據後回覆 D。A 至 D 姓名待認領，每包二十點。連線標示建議資料契約。</desc><defs><marker id="teal" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#51D8C6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#87BEFF"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#F4C16D"/></marker></defs><g font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif"><rect x="0" y="0" width="1920" height="1080" fill="#071B2B" stroke="none" stroke-width="1"/>
