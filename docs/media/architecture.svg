<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 566" width="1240" height="566" role="img" aria-labelledby="t d">
  <title id="t">專流 ProjectFlow 架構圖</title>
  <desc id="d">一台 Windows 主機上執行 5 個 Docker 容器：網頁、後台 API、資料庫、自動化排程 n8n、內部信箱；本地 AI 模型 Ollama（qwen3 4B）在同一台主機上用顯示卡運算，資料不送到雲端。</desc>
  <defs>
    <style>
      text { font-family: 'Noto Sans TC', 'Microsoft JhengHei', 'PingFang TC', 'Heiti TC', sans-serif; fill: #1f2a2a; }
      .h1 { font-size: 21px; font-weight: 700; }
      .h2 { font-size: 19px; font-weight: 700; }
      .h3 { font-size: 16px; font-weight: 700; }
      .sub { font-size: 14px; fill: #4f5d59; }
      .tag { font-size: 13px; fill: #7a8a86; }
      .mono { font-family: Consolas, 'SFMono-Regular', Menlo, monospace; }
      .green { fill: #2f7d6b; }
      .brown { fill: #a85a12; }
      .cap { font-size: 13px; fill: #7a8a86; }
      .box { fill: #ffffff; stroke: #cfd6d3; stroke-width: 1.5; }
      .dash { stroke-dasharray: 6 5; }
      .ln { fill: none; stroke-width: 2.2; stroke-linejoin: round; }
      .g { stroke: #5d6b67; } .a { stroke: #2f7d6b; stroke-width: 3; } .n { stroke: #a85a12; }
    </style>
    <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5d6b67"/></marker>
    <marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f7d6b"/></marker>
    <marker id="mn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a85a12"/></marker>
  </defs>

  <rect width="1240" height="566" fill="#f6f7f6"/>

  <!-- 使用者 -->
  <text x="106" y="112" text-anchor="middle" class="cap">使用者</text>
  <rect x="16" y="124" width="180" height="64" rx="10" class="box"/>
  <text x="34" y="151" class="h3">本機瀏覽器</text>
  <text x="34" y="174" class="sub">管理者直接使用</text>
  <rect x="16" y="204" width="180" height="64" rx="10" class="box dash"/>
  <text x="34" y="231" class="h3">內網同事</text>
  <text x="34" y="254" class="sub">區網連線（選用）</text>

  <!-- 主機 -->
  <rect x="220" y="16" width="1004" height="508" rx="16" fill="#eef1f0" stroke="#d3dad7" stroke-width="1.5"/>
  <text x="240" y="47" class="h1">一台 Windows 主機</text>
  <text x="240" y="70" class="sub">全部在這台執行，不連外網</text>

  <!-- Docker 群組 -->
  <rect x="240" y="92" width="632" height="416" rx="14" fill="#e3eee9" stroke="#b5cfc5" stroke-width="1.5"/>
  <text x="258" y="120" class="h3 green">Docker：5 個容器</text>

  <!-- 第一列：網頁、後台 API、資料庫 -->
  <rect x="258" y="136" width="124" height="120" rx="10" class="box"/>
  <text x="274" y="166" class="h2">網頁</text>
  <text x="274" y="194" class="sub">使用者畫面</text>
  <text x="274" y="216" class="tag">React</text>

  <rect x="400" y="136" width="330" height="120" rx="12" fill="#ffffff" stroke="#2f7d6b" stroke-width="2.5"/>
  <text x="420" y="166" class="h1">後台 API <tspan class="tag" dx="6">FastAPI</tspan></text>
  <text x="420" y="198" class="h3">業務功能</text>
  <text x="420" y="222" class="sub">帳號權限、專案、任務</text>
  <line x1="570" y1="182" x2="570" y2="236" stroke="#dfe4e2" stroke-width="1.5"/>
  <text x="586" y="198" class="h3 green">AI 閘道</text>
  <text x="586" y="222" class="sub">問答、資料分析、OCR</text>

  <rect x="748" y="136" width="106" height="120" rx="10" class="box"/>
  <text x="764" y="166" class="h2">資料庫</text>
  <text x="764" y="194" class="sub">存業務資料</text>
  <text x="764" y="216" class="tag">PostgreSQL</text>

  <!-- 第二列：儲存 -->
  <rect x="258" y="292" width="137" height="96" rx="10" class="box"/>
  <text x="274" y="324" class="h3">附件檔案</text>
  <text x="274" y="350" class="sub">文件與版本</text>

  <rect x="411" y="292" width="137" height="96" rx="10" class="box"/>
  <text x="427" y="324" class="h3">AI 索引</text>
  <text x="427" y="350" class="sub">讓 AI 找到文件</text>

  <rect x="564" y="292" width="137" height="96" rx="10" class="box dash"/>
  <text x="580" y="324" class="h3">主機資料夾</text>
  <text x="580" y="350" class="sub">每日備份</text>
  <text x="580" y="370" class="sub mono">backups/</text>

  <rect x="717" y="292" width="137" height="96" rx="10" class="box"/>
  <text x="733" y="324" class="h3">資料庫檔案</text>
  <text x="733" y="350" class="sub">資料保存在此</text>

  <!-- 第三列：自動化與通知 -->
  <text x="258" y="410" class="cap">自動化與通知</text>
  <rect x="258" y="418" width="150" height="76" rx="10" class="box"/>
  <text x="274" y="447" class="h3">內部信箱</text>
  <text x="274" y="472" class="sub">收系統通知信</text>

  <rect x="432" y="418" width="260" height="76" rx="12" fill="#ffffff" stroke="#a85a12" stroke-width="2.2"/>
  <text x="450" y="447" class="h3">自動化排程 <tspan class="tag" dx="4">n8n</tspan></text>
  <text x="450" y="472" class="sub">寄通知、每日摘要、週報、每日備份</text>

  <rect x="716" y="418" width="138" height="76" rx="10" class="box"/>
  <text x="732" y="447" class="h3">排程紀錄</text>
  <text x="732" y="472" class="sub">流程設定與結果</text>

  <!-- 本地 AI 模型與顯示卡 -->
  <rect x="896" y="100" width="308" height="172" rx="14" fill="#ffffff" stroke="#2f7d6b" stroke-width="2.8"/>
  <text x="916" y="134" class="h1">本地 AI 模型</text>
  <text x="916" y="158" class="sub">Ollama，只在本機</text>
  <line x1="916" y1="176" x2="1184" y2="176" stroke="#e1e6e4" stroke-width="1.5"/>
  <text x="916" y="206" class="h3 green" style="font-size:18px">qwen3 4B</text>
  <text x="916" y="234" class="sub">讀問題和資料</text>
  <text x="916" y="256" class="sub">寫出回答</text>

  <rect x="896" y="312" width="308" height="132" rx="14" class="box"/>
  <text x="916" y="350" class="h2">顯示卡</text>
  <text x="916" y="382" class="h3 green">GTX 1050 Ti 4GB</text>
  <text x="916" y="410" class="sub">加速 AI 運算</text>

  <!-- 連線：一般請求 -->
  <path d="M196 156 H254" class="ln g" marker-end="url(#mg)"/>
  <path d="M196 236 H254" class="ln g" marker-end="url(#mg)"/>
  <path d="M382 196 H396" class="ln g" marker-end="url(#mg)"/>
  <path d="M730 196 H744" class="ln g" marker-end="url(#mg)"/>
  <path d="M424 256 V274 H326 V288" class="ln g" marker-end="url(#mg)"/>
  <path d="M632 256 V288" class="ln g" marker-end="url(#mg)"/>
  <text x="640" y="278" class="cap">寫入每日備份</text>
  <path d="M801 256 V288" class="ln g" marker-end="url(#mg)"/>
  <path d="M692 456 H712" class="ln g" marker-end="url(#mg)"/>
  <path d="M1050 272 V308" class="ln g" marker-end="url(#mg)"/>

  <!-- 連線：AI 問答 -->
  <path d="M479 256 V287" class="ln a" marker-end="url(#ma)"/>
  <path d="M700 136 V80 H1050 V95" class="ln a" marker-end="url(#ma)"/>
  <text x="875" y="70" text-anchor="middle" class="h3 green" style="font-size:14px">問題＋資料 → 模型</text>

  <!-- 連線：自動排程 -->
  <path d="M556 418 V260" class="ln n" marker-end="url(#mn)"/>
  <path d="M432 456 H412" class="ln n" marker-end="url(#mn)"/>

  <!-- 圖例 -->
  <g transform="translate(830 548)">
    <line x1="0" y1="-5" x2="30" y2="-5" stroke="#5d6b67" stroke-width="2.2"/><text x="38" y="0" class="cap">一般請求</text>
    <line x1="120" y1="-5" x2="150" y2="-5" stroke="#2f7d6b" stroke-width="3"/><text x="158" y="0" class="cap">AI 問答</text>
    <line x1="236" y1="-5" x2="266" y2="-5" stroke="#a85a12" stroke-width="2.2"/><text x="274" y="0" class="cap">自動排程</text>
  </g>
</svg>
