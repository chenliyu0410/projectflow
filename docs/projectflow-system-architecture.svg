<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1350" viewBox="0 0 2400 1350" role="img" aria-labelledby="title desc">
  <title id="title">ProjectFlow 系統架構</title>
  <desc id="desc">ProjectFlow 正式版現況架構圖：使用者經本機、區網或 Tailscale 試用進入 Docker Compose 主機上的 web、api、db 三個容器；AI 閘道、內網 HTTPS、備份與 ERP／AD 整合尚未完成。</desc>
  <defs>
    <style>
      .bg{fill:#fbfdff}
      .host{fill:#f4f8fd;stroke:#9db3cc;stroke-width:2}
      .user{fill:#f7fbff;stroke:#0b4a82;stroke-width:3}
      .done{fill:#d7fbf5;stroke:#12bfb7;stroke-width:3}
      .partial{fill:#fff5dc;stroke:#e69a00;stroke-width:3}
      .todo{fill:#ffffff;stroke:#e8743b;stroke-width:3;stroke-dasharray:14 9}
      .ext{fill:#eef3f9;stroke:#4e729b;stroke-width:3;stroke-dasharray:5 8}
      .chip{fill:#ffffff;stroke:#12bfb7;stroke-width:2}
      .chipPartial{fill:#ffffff;stroke:#e69a00;stroke-width:2}
      .chipTodo{fill:#ffffff;stroke:#e8743b;stroke-width:2;stroke-dasharray:8 6}
      .line{stroke:#0b4a82;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .bus{stroke:#0b4a82;stroke-width:4;fill:none}
      .busTodo{stroke:#e8743b;stroke-width:4;fill:none;stroke-dasharray:12 9}
      .partialLine{stroke:#e69a00;stroke-width:4;fill:none;marker-end:url(#arrowPartial)}
      .todoLine{stroke:#e8743b;stroke-width:4;fill:none;stroke-dasharray:12 9;marker-end:url(#arrowTodo)}
      .extLine{stroke:#4e729b;stroke-width:4;fill:none;stroke-dasharray:5 8;marker-end:url(#arrowExt)}
      .title{font:700 66px "Microsoft JhengHei","PingFang TC","Noto Sans TC",Arial,sans-serif;fill:#071f4d}
      .subtitle{font:700 38px "Microsoft JhengHei","PingFang TC","Noto Sans TC",Arial,sans-serif;fill:#123969}
      .h1{font:700 34px "Microsoft JhengHei","PingFang TC","Noto Sans TC",Arial,sans-serif;fill:#08275c}
      .h2{font:700 28px "Microsoft JhengHei","PingFang TC","Noto Sans TC",Arial,sans-serif;fill:#08275c}
      .body{font:500 25px "Microsoft JhengHei","PingFang TC","Noto Sans TC",Arial,sans-serif;fill:#173b68}
      .small{font:500 21px "Microsoft JhengHei","PingFang TC","Noto Sans TC",Arial,sans-serif;fill:#465f82}
      .c{text-anchor:middle}
      .end{text-anchor:end}
    </style>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="24" markerHeight="24" refX="20" refY="12" orient="auto">
      <path d="M2,3 L22,12 L2,21 Z" fill="#0b4a82"/>
    </marker>
    <marker id="arrowPartial" markerUnits="userSpaceOnUse" markerWidth="24" markerHeight="24" refX="20" refY="12" orient="auto">
      <path d="M2,3 L22,12 L2,21 Z" fill="#e69a00"/>
    </marker>
    <marker id="arrowTodo" markerUnits="userSpaceOnUse" markerWidth="24" markerHeight="24" refX="20" refY="12" orient="auto">
      <path d="M2,3 L22,12 L2,21 Z" fill="#e8743b"/>
    </marker>
    <marker id="arrowExt" markerUnits="userSpaceOnUse" markerWidth="24" markerHeight="24" refX="20" refY="12" orient="auto">
      <path d="M2,3 L22,12 L2,21 Z" fill="#4e729b"/>
    </marker>
    <filter id="softShadow" x="-5%" y="-8%" width="110%" height="122%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0b2a5b" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect class="bg" width="2400" height="1350"/>

  <text class="title" x="70" y="92">ProjectFlow 系統架構</text>
  <text class="subtitle" x="72" y="145">正式版現況（2026-10-20）</text>

  <!-- Legend -->
  <rect class="done" x="1250" y="70" width="56" height="42" rx="8"/>
  <text class="body" x="1320" y="101">已完成</text>
  <rect class="partial" x="1450" y="70" width="56" height="42" rx="8"/>
  <text class="body" x="1520" y="101">試用級／部分完成</text>
  <rect class="todo" x="1790" y="70" width="56" height="42" rx="8"/>
  <text class="body" x="1860" y="101">待建置</text>
  <rect class="ext" x="2000" y="70" width="56" height="42" rx="8"/>
  <text class="body" x="2070" y="101">外部整合目標</text>

  <!-- Docker Compose host -->
  <rect class="host" x="430" y="200" width="1400" height="950" rx="24"/>
  <text class="h2" x="465" y="250">Docker Compose 主機（projectflow-formal）</text>
  <text class="small end" x="1795" y="250">python deploy/start.py 一鍵啟動</text>

  <!-- Users and access paths -->
  <rect class="user" x="40" y="230" width="320" height="160" rx="14" filter="url(#softShadow)"/>
  <text class="h1 c" x="200" y="292">使用者</text>
  <text class="body c" x="200" y="336">員工、專案經理、主管</text>
  <text class="body c" x="200" y="372">管理者、外部試用者</text>
  <path class="line" d="M200 390 V454"/>
  <text class="h2" x="40" y="436">存取方式</text>

  <rect class="done" x="40" y="460" width="320" height="105" rx="14"/>
  <text class="h2 c" x="200" y="505">本機</text>
  <text class="small c" x="200" y="543">127.0.0.1:15173</text>

  <rect class="partial" x="40" y="585" width="320" height="105" rx="14"/>
  <text class="h2 c" x="200" y="630">區網試用（HTTP）</text>
  <text class="small c" x="200" y="668">start.py --lan</text>

  <rect class="partial" x="40" y="710" width="320" height="105" rx="14"/>
  <text class="h2 c" x="200" y="755">網際網路試用</text>
  <text class="small c" x="200" y="793">Tailscale Funnel（HTTPS）</text>

  <rect class="todo" x="40" y="835" width="320" height="105" rx="14"/>
  <text class="h2 c" x="200" y="880">內網正式部署</text>
  <text class="small c" x="200" y="918">內部 HTTPS（待建置）</text>

  <path class="bus" d="M360 512 H400 M360 637 H400 M360 762 H400 M400 512 V762"/>
  <path class="busTodo" d="M360 887 H400 V762"/>
  <path class="line" d="M400 600 H468"/>

  <!-- Single-file demo kept for reference -->
  <rect class="done" x="40" y="990" width="360" height="150" rx="14"/>
  <text class="h2 c" x="220" y="1035">單檔 Demo（保留參照）</text>
  <text class="small c" x="220" y="1075">projectflow-full-demo.html</text>
  <text class="small c" x="220" y="1108">localStorage／IndexedDB</text>

  <!-- web -->
  <rect class="done" x="470" y="430" width="320" height="340" rx="14" filter="url(#softShadow)"/>
  <text class="h1 c" x="630" y="490">web 容器</text>
  <text class="body c" x="630" y="540">nginx＋React 19</text>
  <text class="body c" x="630" y="577">TypeScript 單頁應用</text>
  <text class="small c" x="630" y="640">15173：本機／區網</text>
  <text class="small c" x="630" y="675">15174：公開試用</text>
  <text class="small c" x="630" y="708">只收 *.ts.net 主機名</text>

  <path class="line" d="M790 600 H858"/>
  <text class="small c" x="824" y="588">/api/</text>

  <!-- api -->
  <rect class="done" x="860" y="290" width="520" height="550" rx="14" filter="url(#softShadow)"/>
  <text class="h1 c" x="1120" y="345">api 容器</text>
  <text class="body c" x="1120" y="388">FastAPI＋Uvicorn（Python 3.13）</text>

  <rect class="chip" x="885" y="412" width="225" height="48" rx="9"/>
  <text class="small c" x="997" y="443">登入／公司隔離</text>
  <rect class="chip" x="1130" y="412" width="225" height="48" rx="9"/>
  <text class="small c" x="1242" y="443">權限／部門／協作</text>
  <rect class="chip" x="885" y="470" width="225" height="48" rx="9"/>
  <text class="small c" x="997" y="501">專案與任務樹</text>
  <rect class="chip" x="1130" y="470" width="225" height="48" rx="9"/>
  <text class="small c" x="1242" y="501">時程／相依／閘門</text>
  <rect class="chip" x="885" y="528" width="225" height="48" rx="9"/>
  <text class="small c" x="997" y="559">模板／工作流</text>
  <rect class="chip" x="1130" y="528" width="225" height="48" rx="9"/>
  <text class="small c" x="1242" y="559">回報／筆記／通知</text>
  <rect class="chip" x="885" y="586" width="225" height="48" rx="9"/>
  <text class="small c" x="997" y="617">文件／附件</text>
  <rect class="chip" x="1130" y="586" width="225" height="48" rx="9"/>
  <text class="small c" x="1242" y="617">營運資料／任務關聯</text>
  <rect class="chip" x="885" y="644" width="225" height="48" rx="9"/>
  <text class="small c" x="997" y="675">採購／庫存／工單</text>
  <rect class="chip" x="1130" y="644" width="225" height="48" rx="9"/>
  <text class="small c" x="1242" y="675">稽核紀錄</text>
  <rect class="chipPartial" x="885" y="702" width="470" height="48" rx="9"/>
  <text class="small c" x="1120" y="733">AI 副手：文件問答＋受控 Text-to-SQL</text>
  <text class="small c" x="1120" y="800">權限與商業規則都在後端・寫入與稽核同一個交易</text>

  <!-- db -->
  <path class="line" d="M1380 440 H1438"/>
  <text class="small c" x="1410" y="428">讀寫</text>
  <rect class="done" x="1440" y="290" width="350" height="290" rx="14" filter="url(#softShadow)"/>
  <text class="h1 c" x="1615" y="345">db 容器</text>
  <text class="body c" x="1615" y="390">PostgreSQL 17</text>
  <text class="body c" x="1615" y="428">約 30 張資料表</text>
  <text class="small c" x="1615" y="465">19 個 Alembic migration</text>
  <text class="small c" x="1615" y="497">pgdata volume・不對外開埠</text>
  <rect class="chipTodo" x="1465" y="515" width="300" height="46" rx="9"/>
  <text class="small c" x="1615" y="545">pgvector 向量（待建置）</text>

  <!-- volumes -->
  <path class="line" d="M1380 690 H1438"/>
  <rect class="done" x="1440" y="650" width="350" height="80" rx="14"/>
  <text class="body c" x="1615" y="699">files：附件、文件版本</text>
  <path class="line" d="M1380 790 H1438"/>
  <rect class="done" x="1440" y="750" width="350" height="80" rx="14"/>
  <text class="body c" x="1615" y="799">ai_data：AI 展示資料</text>

  <!-- AI gateway (to build) -->
  <path class="todoLine" d="M1000 840 V918"/>
  <rect class="todo" x="860" y="920" width="930" height="200" rx="14"/>
  <text class="h1 c" x="1325" y="972">AI 閘道（待建置）</text>
  <rect class="chipTodo" x="895" y="995" width="200" height="50" rx="9"/>
  <text class="small c" x="995" y="1027">資料分級</text>
  <rect class="chipTodo" x="1115" y="995" width="200" height="50" rx="9"/>
  <text class="small c" x="1215" y="1027">遮罩與還原</text>
  <rect class="chipTodo" x="1335" y="995" width="200" height="50" rx="9"/>
  <text class="small c" x="1435" y="1027">依功能路由</text>
  <rect class="chipTodo" x="1555" y="995" width="200" height="50" rx="9"/>
  <text class="small c" x="1655" y="1027">雲端可一鍵關閉</text>
  <text class="small c" x="1325" y="1090">建好後所有 AI 請求都先經過這裡；機密資料只送本地模型</text>

  <!-- Current direct call to Ollama -->
  <path class="partialLine" d="M1300 840 V880 H1860 V970 H1938"/>
  <text class="small c" x="1580" y="870">目前：api 直接呼叫 Ollama（只接受私有 IP）</text>

  <!-- External targets -->
  <path class="extLine" d="M1790 380 H1938"/>
  <rect class="ext" x="1940" y="290" width="420" height="180" rx="14"/>
  <text class="h2 c" x="2150" y="345">備份主機／NAS（待建置）</text>
  <text class="small c" x="2150" y="390">目前部署前手動 pg_dump</text>
  <text class="small c" x="2150" y="425">每日排程備份與還原演練</text>

  <path class="extLine" d="M1380 625 H1938"/>
  <text class="small c" x="1615" y="614">同步／登入（待整合）</text>
  <rect class="ext" x="1940" y="530" width="420" height="190" rx="14"/>
  <text class="h2 c" x="2150" y="590">公司系統（待整合）</text>
  <text class="body c" x="2150" y="635">ERP 營運資料同步</text>
  <text class="body c" x="2150" y="675">AD／LDAP 帳號登入</text>

  <rect class="partial" x="1940" y="905" width="420" height="130" rx="14"/>
  <text class="h2 c" x="2150" y="950">Ollama（選用）</text>
  <text class="small c" x="2150" y="985">內網另一台機器；連線設定已提供</text>
  <text class="small c" x="2150" y="1017">模型尚未部署與評估</text>

  <path class="todoLine" d="M1790 1100 H1938"/>
  <rect class="ext" x="1940" y="1060" width="420" height="120" rx="14"/>
  <text class="h2 c" x="2150" y="1110">雲端 LLM（選用）</text>
  <text class="small c" x="2150" y="1150">預設不使用；只送遮罩後內容</text>

  <!-- Footer -->
  <text class="small" x="70" y="1250">部署：Docker Compose 三個容器（db、api、web），一行 python deploy/start.py 啟動；資料庫用 Alembic 逐版升級，既有資料保留。</text>
  <text class="small" x="70" y="1290">縮寫：API 應用程式介面｜RAG 檢索增強生成｜LLM 大型語言模型｜NAS 網路附加儲存｜ERP 企業資源規劃｜AD／LDAP 公司帳號目錄</text>
</svg>
