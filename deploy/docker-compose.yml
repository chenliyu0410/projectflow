name: projectflow-formal
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: projectflow
      POSTGRES_USER: projectflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U projectflow -d projectflow']
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    environment:
      DATABASE_URL: postgresql://projectflow:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}@db:5432/projectflow
      PF_SHOWCASE_MODE: ${PF_SHOWCASE_MODE:-false}
      PF_ACCEPTANCE_MODE: ${PF_ACCEPTANCE_MODE:-false}
      PF_ATTACHMENT_ROOT: ${PF_ATTACHMENT_ROOT:-/var/lib/projectflow-files}
      PF_ATTACHMENT_QUOTA_BYTES: ${PF_ATTACHMENT_QUOTA_BYTES:-1000000000}
      PF_AI_ROOT: /var/lib/projectflow-ai
    volumes:
      - files:/var/lib/projectflow-files
      - ai_data:/var/lib/projectflow-ai
    ports:
      - '127.0.0.1:${API_PORT:-18000}:8000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health/ready", timeout=5)']
      interval: 3s
      timeout: 6s
      retries: 20
  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    ports:
      - '127.0.0.1:${WEB_PORT:-15173}:80'
    depends_on:
      api:
        condition: service_healthy
volumes:
  pgdata:
  files:
  ai_data:
