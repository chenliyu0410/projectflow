name: projectflow-formal
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: projectflow
      POSTGRES_USER: projectflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U projectflow -d projectflow']
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
      args:
        WITH_OCR: ${PF_AI_OCR:-false}
    environment:
      DATABASE_URL: postgresql://projectflow:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}@db:5432/projectflow
      PF_SHOWCASE_MODE: ${PF_SHOWCASE_MODE:-false}
      PF_SHOWCASE_LAN: ${PF_SHOWCASE_LAN:-false}
      PF_WEB_LAN: ${PF_WEB_LAN:-false}
      PF_ACCEPTANCE_MODE: ${PF_ACCEPTANCE_MODE:-false}
      PF_ATTACHMENT_ROOT: ${PF_ATTACHMENT_ROOT:-/var/lib/projectflow-files}
      PF_ATTACHMENT_QUOTA_BYTES: ${PF_ATTACHMENT_QUOTA_BYTES:-1000000000}
      PF_AI_ROOT: /var/lib/projectflow-ai
      PF_AI_OCR: ${PF_AI_OCR:-false}
      PF_AI_OCR_MODEL_DIR: /opt/ocr-models
      # AI formal document index; with auto update on, new uploads are indexed within about 10 s (single API process).
      PF_AI_FORMAL_INDEX: ${PF_AI_FORMAL_INDEX:-false}
      PF_AI_INDEX_AUTO_UPDATE: ${PF_AI_INDEX_AUTO_UPDATE:-false}
      PF_N8N_TOKEN: ${PF_N8N_TOKEN:-}
      PF_PUBLIC_URL: ${PF_PUBLIC_URL:-http://127.0.0.1:15173}
      PF_INBOX_ROOT: /var/lib/projectflow-inbox
      PF_BACKUP_ROOT: /var/lib/projectflow-backups
    volumes:
      - files:/var/lib/projectflow-files
      - ai_data:/var/lib/projectflow-ai
      - ${PF_OCR_MODELS_HOST:-./ocr-models}:/opt/ocr-models:ro
      # N8N: drop files here (inbox) and find daily backups here; both are folders on this computer.
      - ${PF_INBOX_HOST:-./inbox}:/var/lib/projectflow-inbox
      - ${PF_BACKUP_HOST:-./backups}:/var/lib/projectflow-backups
    ports:
      - '127.0.0.1:${API_PORT:-18000}:8000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health/ready", timeout=5)']
      interval: 3s
      timeout: 6s
      retries: 20
  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    ports:
      - '${WEB_BIND:-127.0.0.1}:${WEB_PORT:-15173}:80'
    depends_on:
      api:
        condition: service_healthy
  # N8N batch 1 (opt-in: docker compose --profile n8n up -d). Mailpit is the demo mailbox; nothing leaves this machine.
  mailpit:
    profiles: [n8n]
    image: ghcr.io/axllent/mailpit:v1.32.0
    ports:
      - '127.0.0.1:${MAILPIT_PORT:-8025}:8025'
  n8n:
    profiles: [n8n]
    image: docker.n8n.io/n8nio/n8n:2.45.7
    environment:
      GENERIC_TIMEZONE: Asia/Taipei
      TZ: Asia/Taipei
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      N8N_TEMPLATES_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'false'
      N8N_SECURE_COOKIE: 'false'
      PF_API_URL: http://api:8000
      PF_N8N_TOKEN: ${PF_N8N_TOKEN:-}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/opt/projectflow-n8n:ro
    ports:
      - '127.0.0.1:${N8N_PORT:-5678}:5678'
    depends_on:
      api:
        condition: service_healthy
      mailpit:
        condition: service_started
volumes:
  pgdata:
  files:
  ai_data:
  n8n_data:
