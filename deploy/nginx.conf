# Port 81 is published only by docker-compose.public.yml, as the loopback target of Tailscale
# Funnel. Internet visitors can send any Host header and the API treats 127.0.0.1 or localhost as
# this machine, so port 81 accepts only <machine>.<tailnet>.ts.net (the value the API will see).
map "$server_port:$http_host" $pf_reject_host {
  default 0;
  "~*^81:[a-z0-9-]+\.[a-z0-9-]+\.ts\.net(:[0-9]+)?$" 0;
  "~^81:" 1;
}

# Funnel ends TLS before port 81. The API compares Origin with its own URL, so it must know the
# visitor used HTTPS; set on every request, this also overwrites whatever a client sent.
map $server_port $pf_forwarded_proto {
  81 https;
  default http;
}

server {
  listen 80;
  listen 81;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 10000000;
  if ($pf_reject_host) {
    return 421;
  }
  # Inherited by every location below; a location that sets its own proxy headers loses all three.
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $pf_forwarded_proto;
  proxy_set_header X-Forwarded-For $remote_addr;
  location ~ ^/api/nodes/[^/]+/attachments$ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://api:8000;
    proxy_connect_timeout 3s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    client_body_timeout 120s;
  }
  location /api/ai/ {
    proxy_pass http://api:8000/ai/;
    proxy_connect_timeout 3s;
    proxy_read_timeout 75s;
  }
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_connect_timeout 3s;
    proxy_read_timeout 8s;
  }
  location / { try_files $uri $uri/ /index.html; }
}
