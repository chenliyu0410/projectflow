<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>專流 ProjectFlow｜完整功能 Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
:root{
  --ground:#F6F4EF; --side:#EFEBE3; --col:#EFEBE3; --surface:#FFFFFF;
  --ink:#1C1B19; --ink2:#3D3A35; --muted:#5E5B55; --line:#E3DFD6; --line2:#D3CCBF;
  --teal:#1F5F5B; --teal-soft:#E4EFEE; --orange:#B4541F; --orange-soft:#F7E6DA; --orange-ink:#8A3F16;
  --red:#A3321A; --red-soft:#FBE9E0; --blue:#4A5A8C; --blue-soft:#E7EAF3; --gray:#8A8479;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--ground);color:var(--ink);font-size:14px}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.serif{font-family:"Noto Serif TC",serif}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--muted)}
.small{font-size:12px}
a{color:var(--teal)}

.app{display:flex;height:100vh;min-height:640px}

/* 側邊欄 */
.side{width:252px;flex-shrink:0;background:var(--side);border-right:1px solid #E0DBD0;display:flex;flex-direction:column;padding:18px 12px;gap:18px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand .mark{width:32px;height:32px;border-radius:8px;background:var(--teal);display:flex;align-items:center;justify-content:center}
.brand b{font-size:19px;letter-spacing:.5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--ink2);border:none;background:transparent;text-align:left;width:100%}
.nav button:hover{background:#E6E1D6}
.nav button[aria-current="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.06);font-weight:500}
.nav .badge{margin-left:auto}
.badge{font-size:11px;background:var(--orange);color:#fff;border-radius:10px;padding:1px 7px;font-weight:700}
.group-title{font-size:12px;font-weight:700;color:var(--muted);padding:0 10px;letter-spacing:1px}
.plist{display:flex;flex-direction:column;gap:4px}
.pbtn{display:flex;align-items:center;gap:10px;padding:9px 10px;min-height:44px;border:none;border-radius:8px;text-align:left;width:100%;background:transparent}
.pbtn:hover{background:#E6E1D6}
.pbtn[aria-current="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.pdot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.pinfo{display:flex;flex-direction:column;gap:6px;flex-grow:1;min-width:0}
.pname{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptrack{height:4px;border-radius:2px;background:#DAD4C8;overflow:hidden}
.ptrack span{display:block;height:100%;transition:width .3s}
.ppct{font-size:12px;color:var(--muted)}
.newp{display:flex;align-items:center;gap:8px;padding:10px;min-height:44px;border:1px dashed #C9C2B4;border-radius:8px;background:transparent;color:var(--muted);margin-top:4px;width:100%}
.me{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:10px;background:#E6E1D6}
.me .row{display:flex;align-items:center;gap:10px}
.me select{height:34px;border:1px solid var(--line2);border-radius:8px;background:#fff;padding:0 6px;width:100%}
.avatar{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.av{width:24px;height:24px;background:#EAE6DD;font-size:11px;color:var(--ink2)}
.reset{border:none;background:transparent;color:var(--muted);font-size:12px;text-decoration:underline;padding:0;text-align:left}

/* 主區 */
.main{flex-grow:1;min-width:0;display:flex;flex-direction:column;padding:20px 26px;gap:16px;overflow:hidden}
.main.scroll{overflow:auto}
.main.vscroll{overflow-y:auto}
.main > :not(.view){flex-shrink:0}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:13px;color:var(--muted)}
.crumbs button{border:none;background:transparent;padding:2px 4px;border-radius:4px;color:var(--muted)}
.crumbs button:hover{background:#E6E1D6;color:var(--ink)}
.crumbs .cur{color:var(--ink);font-weight:500;padding:2px 4px}
h1{margin:6px 0;font-size:28px;line-height:1.3}
h2{font-size:18px;margin:0}
.meta{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap;align-items:center}
.head-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.members{display:flex;padding-left:8px}
.members span{width:32px;height:32px;background:var(--surface);border:2px solid var(--ground);margin-left:-8px;font-size:12px;color:var(--teal)}
.btn{height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:#BDB5A6}
.btn.sm{height:32px;padding:0 10px;border-radius:8px;font-size:13px}
.btn.primary{border:none;background:var(--teal);color:#fff;font-weight:500}
.btn.primary:hover:not(:disabled){background:#174A47}
.btn.warn{border:none;background:var(--orange);color:#fff;font-weight:500}
.btn.danger{border-color:#E3B294;color:var(--red)}
.btn.ghost{border-color:transparent;background:transparent}
.btn[aria-pressed="true"]{background:var(--teal-soft);border-color:var(--teal);color:var(--teal)}

.progress{display:flex;align-items:center;gap:8px}
.progress .track{width:140px;height:6px;border-radius:3px;background:#E6E1D6;overflow:hidden}
.progress .track span{display:block;height:100%;background:var(--teal);transition:width .3s}
.progress b{font-size:13px}

.phases{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;display:flex;gap:8px}
.phase{flex:1 1 0;display:flex;flex-direction:column;gap:7px;min-width:0;border:none;background:transparent;padding:0;text-align:left}
.phase .bar{height:6px;border-radius:3px;background:#E6E1D6;overflow:hidden}
.phase .bar span{display:block;height:100%}
.phase .row{display:flex;justify-content:space-between;gap:6px;align-items:center}
.phase .nm{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phase .gate{font-size:11px;white-space:nowrap;padding:1px 6px;border-radius:6px;background:#EFEBE3;color:var(--muted)}
.phase .gate.ok{background:var(--teal-soft);color:var(--teal)}
.phase .gate.ov{background:var(--orange-soft);color:var(--orange-ink)}
.phase.cur .nm{font-weight:700}
.phase:hover .nm{text-decoration:underline}

.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;background:#EAE6DD;padding:4px;border-radius:10px;flex-wrap:wrap}
.tab{height:34px;padding:0 14px;border:none;border-radius:8px;background:transparent}
.tab[aria-selected="true"]{background:var(--surface);font-weight:700}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.tools label{display:inline-flex;align-items:center;gap:4px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{border:none;background:#fff;height:32px;padding:0 10px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--teal);color:#fff}

.view{flex-grow:1;min-height:0}
.board{height:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.column{background:var(--col);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto;transition:background .15s}
.column.over{background:#E2DCCF}
.colhead{display:flex;justify-content:space-between;align-items:center;padding:2px 4px}
.colhead b{font-size:14px}
.colhead span{font-size:12px;color:var(--muted);background:#E0DBD0;border-radius:10px;padding:2px 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;cursor:grab;transition:box-shadow .15s,border-color .15s}
.card:active{cursor:grabbing}
.card.dragging{opacity:.4}
.card.late{border-color:#E3B294}
.card.nest{outline:2px dashed var(--teal);outline-offset:2px}
.card.hl{box-shadow:0 0 0 2px var(--orange)}
.card.hl-src{box-shadow:0 0 0 2px var(--teal)}
.tags{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.tag{font-size:11.5px;padding:1px 7px;border-radius:6px;background:var(--teal-soft);color:var(--teal);white-space:nowrap}
.tag.ai{background:var(--orange-soft);color:var(--orange-ink)}
.tag.warn{background:var(--red-soft);color:#8A2E0F}
.tag.gray{background:#EFEBE3;color:var(--muted)}
.tag.blue{background:var(--blue-soft);color:var(--blue)}
.tag.erp{background:#EDE7F6;color:#5B3F8C}
.lv{font-size:11px;padding:1px 6px;border-radius:6px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.lv.confidential{border-color:#E3B294;color:var(--red);background:#FFF6F1}
.lv.public{border-color:#BFD8D5;color:var(--teal)}
.ctitle{font-weight:500;line-height:1.5;border:none;background:none;padding:0;text-align:left}
.ctitle:hover{text-decoration:underline}
.cfoot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);gap:6px}
.who{display:flex;align-items:center;gap:6px}
.mini{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.mini .track{flex-grow:1;height:4px;border-radius:2px;background:#E6E1D6;overflow:hidden}
.mini .track span{display:block;height:100%;background:var(--teal)}
.sublist{display:flex;flex-direction:column;gap:4px;border-top:1px dashed var(--line);padding-top:6px}
.sublist button{display:flex;align-items:center;gap:6px;border:none;background:transparent;padding:3px 2px;font-size:12.5px;text-align:left;border-radius:4px}
.sublist button:hover{background:var(--ground)}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:#CFC8BA}
.dot.doing{background:#E8A77F}.dot.review{background:var(--blue)}.dot.done,.dot.skipped{background:var(--teal)}
.iconbtn{border:none;background:transparent;border-radius:6px;padding:2px 6px;color:var(--muted);font-size:12px}
.iconbtn:hover{background:var(--ground);color:var(--ink)}
.hint{font-size:12px;color:var(--muted);text-align:center;padding:8px}

/* 時程 */
.tl{height:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:auto;position:relative}
.tl-inner{position:relative}
.tl-row{display:flex;height:34px;border-top:1px solid #F0EDE6;position:relative}
.tl-row.tlh{height:40px;border-top:none;position:sticky;top:0;z-index:4;background:var(--surface);border-bottom:1px solid var(--line)}
.deptbar{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px;flex-shrink:0}
.view:has(> .deptbar){display:flex;flex-direction:column}
.deptbar + .tl{flex:1 1 0;min-height:0;height:auto}
.deptbar button{height:30px;padding:0 10px;border:1px solid var(--line2);border-radius:15px;background:#fff;font-size:13px}
.deptbar button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.deptbar button.zero{opacity:.5}
.tl-row.dim .tl-label .nm,.tl-row.dim .gb{opacity:.45}
.tl-label .cnt{margin-left:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.tl-label{width:270px;flex-shrink:0;position:sticky;left:0;z-index:3;background:var(--surface);display:flex;align-items:center;gap:4px;padding-right:6px;font-size:13px;border-right:1px solid var(--line);white-space:nowrap;overflow:hidden}
.tl-row.tlh .tl-label{z-index:5;font-size:12px;font-weight:700;color:var(--muted);padding-left:12px}
.tl-label .tw{border:none;background:transparent;width:20px;height:20px;padding:0;color:var(--muted);flex-shrink:0;border-radius:4px}
.tl-label .tw:hover{background:var(--ground)}
.tl-label .nm{overflow:hidden;text-overflow:ellipsis;border:none;background:none;padding:0;text-align:left;flex-grow:1;min-width:0}
.tl-label .nm:hover{text-decoration:underline}
.tl-label .plus,.tl-label .ed{opacity:0;border:none;background:transparent;color:var(--teal);font-size:15px;padding:0 4px;flex-shrink:0}
.tl-label .ed{color:var(--muted);font-size:13px}
.tl-row:hover .plus,.tl-row:hover .ed,.tl-label .ed:focus-visible,.tl-label .plus:focus-visible{opacity:1}
.tl-row.self,.tl-row.self .tl-label{background:#F4F8F7}
.tl-row.self .nm{font-weight:700;color:var(--teal)}
.gb:not(.self-bar){cursor:pointer}
.tl-row.parent .nm{font-weight:700}
.tl-track{position:relative;flex-shrink:0}
.tl-scale{position:absolute;inset:0}
.tl-scale span{position:absolute;top:0;bottom:0;border-left:1px solid #ECE8E0;font-size:11px;color:var(--muted);padding:3px 0 0 4px;white-space:nowrap}
.tl-scale span.sub{top:20px;border-left-color:#F3F0EA;font-size:10px}
.grid-bg{position:absolute;inset:0;pointer-events:none}
.gb{position:absolute;top:6px;height:22px;border-radius:6px;font-size:11px;color:#fff;display:flex;align-items:center;padding:0 8px;white-space:nowrap;overflow:hidden;cursor:grab;touch-action:none;user-select:none;z-index:2}
.gb.done{background:var(--gray) !important}
.gb.parent{background:#fff;border:1.5px solid var(--c);color:var(--ink);cursor:pointer;padding:0}
.gb.parent .pf{position:absolute;left:0;top:0;bottom:0;background:var(--c);opacity:.3}
.gb.parent .pl{position:relative;padding:0 8px;font-weight:500}
.gb.parent.done{background:#EFEDE8 !important;border-color:var(--gray)}
.gb.late{box-shadow:0 0 0 2px #E3B294}
.gb.crit{box-shadow:0 0 0 3px var(--orange)}
.gb .h{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize}
.gb .h.l{left:0}.gb .h.r{right:0}
.gb.ms{width:18px !important;height:18px;top:8px;transform:rotate(45deg);border-radius:3px;padding:0;margin-left:-9px}
.gb.locked{cursor:not-allowed}
.proj{position:absolute;top:28px;height:3px;background:var(--orange);border-radius:2px;z-index:1;opacity:.8}
.ext{position:absolute;top:8px;height:18px;border:2px dashed #9C8FC0;border-radius:6px;font-size:11px;color:#5B3F8C;display:flex;align-items:center;padding:0 6px;white-space:nowrap;background:#F6F2FB}
.today{position:absolute;top:0;bottom:0;width:2px;background:var(--orange);z-index:1;pointer-events:none}
.today b{position:absolute;top:2px;left:4px;font-size:10px;color:var(--orange);white-space:nowrap}
.ghost{position:absolute;top:6px;height:22px;background:rgba(31,95,91,.25);border:1px dashed var(--teal);border-radius:6px;z-index:2}
.tl-row.add .tl-label{color:var(--muted);font-size:12px;padding-left:28px}
.tl-row.add .tl-track{cursor:crosshair;background:repeating-linear-gradient(45deg,transparent 0 8px,#FAF8F4 8px 16px)}
svg.arrows{position:absolute;left:0;top:0;pointer-events:none;z-index:2;overflow:visible}

/* 相依圖 */
.graph{height:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:auto;position:relative}
.gnode{position:absolute;width:200px;height:58px;overflow:hidden;background:#fff;border:1px solid var(--line2);border-radius:10px;padding:8px 10px;font-size:12.5px;cursor:pointer;z-index:2;display:flex;flex-direction:column;gap:4px}
.gnode:hover{border-color:var(--teal)}
.gnode.sel{box-shadow:0 0 0 3px var(--teal)}
.gnode.crit{border-color:var(--orange);border-width:2px}
.gnode b{font-weight:500;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gnode.done{background:#F7F6F3;color:var(--muted)}
.gmeta{display:flex;gap:5px;align-items:center;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden}
.gpath{overflow:hidden;text-overflow:ellipsis}

/* 文件 */
.docs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-content:start}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left}
.doc:hover{border-color:var(--line2)}
.doc b{font-size:15px;font-weight:500}
.doc span{font-size:12px;color:var(--muted)}

/* 通用面板 / 表格 */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.panel h3{margin:0 0 10px;font-size:15px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.tbl{border-collapse:collapse;width:100%;font-size:13px}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid #F0EDE6;text-align:left;vertical-align:top}
.tbl th{font-size:12px;color:var(--muted);font-weight:700;background:#FAF8F4;white-space:nowrap;position:sticky;top:0}
.tbl tr.sel td{background:var(--teal-soft)}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#FAF8F4}
.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.lock{color:var(--red);font-size:12px;white-space:nowrap}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.chain{display:flex;gap:8px;align-items:stretch;overflow:auto;padding-bottom:4px}
.chain .step{min-width:150px;background:var(--ground);border-radius:10px;padding:10px;font-size:12.5px;display:flex;flex-direction:column;gap:4px}
.chain .step b{font-size:11px;color:var(--muted)}
.chain .arr{align-self:center;color:var(--muted)}
.statflow{display:flex;gap:4px;flex-wrap:wrap;align-items:center;font-size:12px}
.statflow span{padding:2px 8px;border-radius:10px;background:#EFEBE3;color:var(--muted)}
.statflow span.on{background:var(--teal);color:#fff}
.statflow i{color:var(--line2);font-style:normal}
.check{color:var(--teal)}.cross{color:var(--red)}
.empty{font-size:13px;color:var(--muted);line-height:1.7;padding:6px 0}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:24px;font-family:"Noto Serif TC",serif}
.stat span{font-size:12px;color:var(--muted)}
.bar-h{height:8px;background:#E6E1D6;border-radius:4px;overflow:hidden}
.bar-h span{display:block;height:100%;background:var(--teal)}
.bar-h span.hot{background:var(--orange)}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.pagehead p{margin:4px 0 0;color:var(--muted);font-size:13px}
.stack{display:flex;flex-direction:column;gap:14px}
.records{display:grid;gap:14px;max-width:920px}
.records h3{margin:0}
.rec{border-top:1px solid var(--line);padding:10px 0}
.rec:first-of-type{border-top:none}
.rec .body{margin-top:6px;white-space:pre-wrap;line-height:1.7}
.rcard{border:2px solid var(--teal);margin:14px 0 6px}
.rcard.pend{border-color:var(--blue)}
.rcard.rej{border-color:var(--orange)}
.rcard.skip{border-color:var(--gray)}
.rcard .rc-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.rcard .rc-main{min-width:0;flex:1 1 240px}
.rcard h3{margin:0}
.rcard .rc-sum{margin-top:6px;white-space:pre-wrap;line-height:1.7;max-height:10.2em;overflow:auto}
.rcard .rc-acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* AI 副手 */
.ai{width:350px;flex-shrink:0;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;padding:18px 18px;gap:12px;overflow:hidden}
.aihead{display:flex;align-items:center;gap:10px}
.aihead .avatar{width:32px;height:32px;background:var(--orange-soft)}
.aihead b{font-size:17px}
.aihead small{display:block;font-size:12px;color:var(--muted)}
.policy{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:var(--ground);border-radius:8px;padding:6px 10px}

.msg > b{font-size:12px;color:var(--teal)}

.route.cloud{background:var(--blue-soft);color:var(--blue)}
.route.masked{background:var(--orange-soft);color:var(--orange-ink)}
.route.local{background:var(--teal-soft);color:var(--teal)}
.msg .btns{display:flex;gap:6px;flex-wrap:wrap}
.ask{display:flex;gap:8px}
.ask input{flex-grow:1;min-width:0;height:42px;border:1px solid var(--line2);border-radius:10px;padding:0 12px;background:var(--surface)}
.ask button{width:42px;height:42px;border-radius:10px;border:none;background:var(--teal);display:flex;align-items:center;justify-content:center}

dialog{border:none;border-radius:14px;padding:22px;width:min(520px,94vw);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
dialog.wide{width:min(820px,96vw)}
dialog::backdrop{background:rgba(28,27,25,.35)}
dialog h2{margin:0 0 14px;font-size:20px}

.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}

.field textarea{padding:8px 10px;min-height:120px;resize:vertical;line-height:1.6}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}

.deprow{display:flex;gap:6px;align-items:center;font-size:13px;padding:6px 8px;border-radius:8px;background:var(--ground);margin-bottom:6px;flex-wrap:wrap}
.deprow select,.deprow input{height:32px;border:1px solid var(--line2);border-radius:6px;background:#fff;padding:0 6px}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px;flex-wrap:wrap}
.dlg-actions .left{margin-right:auto;display:flex;gap:8px;flex-wrap:wrap}
.note{font-size:12.5px;line-height:1.6;background:var(--ground);border-radius:8px;padding:8px 10px;color:var(--ink2)}
.note.warn{background:var(--red-soft);color:#7A2A10}
.md{font-size:13.5px;line-height:1.75}
.md h1,.md h2,.md h3{font-size:16px;margin:10px 0 4px}
.md ul{margin:4px 0;padding-left:20px}
.mdgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mdgrid textarea{width:100%;min-height:260px;border:1px solid var(--line2);border-radius:8px;padding:8px;line-height:1.6;font-size:13px}
.mdgrid .md{border:1px solid var(--line);border-radius:8px;padding:8px 12px;overflow:auto;max-height:320px}
.listpick{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.listpick label{display:flex;gap:8px;align-items:center;padding:7px 10px;border-bottom:1px solid #F0EDE6;font-size:13px;font-weight:400}

.toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:100;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:90vw;pointer-events:auto;display:flex;gap:10px;align-items:center}
.toast.warn{background:var(--orange-ink)}
.toast button{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:6px;padding:2px 8px;font-size:12px}

.mbar{display:none}
@media (max-width:1180px){

}

  .mdgrid{grid-template-columns:1fr}

.mbar{gap:8px;justify-content:space-between}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}

}

/* ================= 閘門 ================= */
function gateCriteriaMet(ph) { const k = kids(ph.id); return k.length > 0 && k.every((c) => DONE(c.status)); }

/* ================= 狀態變更 ================= */
function setStatus(id, to, opts = {}) {
  const n = node(id);
  if (!n || n.status === to) return true;
  const pr = !opts.system ? pendingReport(id) : null;
  if (pr) {
    // 有待確認的完成回報：拖到已完成＝確認（需權限），其他移動一律擋下
    if (to === 'done' && can('override', n)) return decideReport(pr.id, true);
    toast(to === 'done' ? `此任務有待確認的完成回報，需由 ${approversFor(n).map(uname).join('、')} 確認` : '此任務有待確認的完成回報，請到「紀錄」分頁確認或退回', 'warn');
    render(); return false;
  }
  if (!opts.system && n.status === 'skipped') { toast('已跳過的任務請用「恢復任務」還原', 'warn'); render(); return false; }
  if (!opts.system && !can('edit', n)) { toast('你的角色無權變更此任務', 'warn'); return false; }
  const bl = findBlockers(n, to);
  const hard = bl.filter((b) => b.hard);
  if (hard.length && !opts.force) { openBlockDialog(n, to, bl); return false; }
  const soft = bl.filter((b) => !b.hard);
  const from = n.status;
  commit(`「${n.title}」${STLBL[from]} → ${STLBL[to]}`, () => {
    n.status = to;
    if (to === 'doing' && n.progress == null) n.progress = null;
    // 上層狀態連動
    let p = n.parent ? node(n.parent) : null;
    while (p && p.type !== 'project') {
      const k = kids(p.id);
      if (to !== 'todo' && p.status === 'todo') p.status = 'doing';
      if (k.every((c) => DONE(c.status)) && !DONE(p.status)) { p.status = 'review'; notify(`「${p.title}」的子任務全部完成，已移到「審核中」，請確認後標為完成。`); }
      p = p.parent ? node(p.parent) : null;
    }
  });
  log(n.id, '狀態', `「${n.title}」從「${STLBL[from]}」移到「${STLBL[to]}」${opts.reason ? `（覆寫理由：${opts.reason}）` : ''}${opts.system ? `（${opts.system}）` : ''}`, opts.actor);
  if (soft.length) toast('軟性前置未滿足，已允許開始：' + soft.map((b) => b.text).join('；'), 'warn');
  if (DONE(to)) announceUnlocks(n);
  return true;
}
function announceUnlocks(n) {
  const targets = new Set();
  const doneIds = new Set([n.id, ...ancestors(n).map((a) => a.id)]);
  db.deps.filter((d) => doneIds.has(d.from)).forEach((d) => {
    const t = node(d.to);
    if (!t || DONE(t.status)) return;
    if (findBlockers(t, 'doing').filter((b) => b.hard).length === 0) targets.add(t);
  });
  if (targets.size) {
    const list = [...targets];
    notify(`前置條件已滿足，以下任務現在可以開始（已通知負責人）：\n· ${list.map((t) => `${t.title}（${uname(t.owner)}）`).join('\n· ')}`);
  }
}
function notify(text, title = '活動紀錄') { ui.chat.push({ title, text }); audit.notes.unshift({ at: nowStr(), text }); if (ui.chat.length > 80) ui.chat.shift(); renderChat(); }

/* ================= 任務紀錄（F11）與跳過任務 ================= */
// 附件檔案內容存在 IndexedDB（key = 附件 id），中繼資料存在 db.attachments
const fileStore = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    try {
      const rq = indexedDB.open('projectflow-files', 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore('blobs');
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error);
    } catch (e) { rej(e); }
  }));
  const tx = (mode, fn) => open().then((d) => new Promise((res, rej) => {
    const t = d.transaction('blobs', mode);
    const r = fn(t.objectStore('blobs'));
    t.oncomplete = () => res(r ? r.result : undefined);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error);
  }));
  return {
    ok: null,
    async check() { try { await open(); this.ok = true; } catch (e) { this.ok = false; dbp = null; } return this.ok; },
    put: (id, blob) => tx('readwrite', (st) => st.put(blob, id)),
    get: (id) => tx('readonly', (st) => st.get(id)),
    clear: () => tx('readwrite', (st) => st.clear()).catch(() => {}),
  };
})();
function resetAll() {
  try { localStorage.removeItem(KEY); } catch (err) { /* 忽略 */ }
  db = seed(); audit = freshAudit(); undoStack.length = 0;
  Object.assign(ui, { page: 'node', node: 'p1', tab: 'board', chat: [], expanded: {}, redteam: '', tlDept: 'all' });
  render();
  return fileStore.clear();
}
/* ---------- 完成回報 ---------- */
function fieldDefs(nodeId) { return db.reportFields.filter((f) => f.node_id === nodeId).sort((a, b) => a.order - b.order); }
function reportsOf(nodeId) { return db.reports.filter((r) => r.node_id === nodeId).sort((a, b) => b.version - a.version); }
function pendingReport(nodeId) { return db.reports.find((r) => r.node_id === nodeId && r.status === 'submitted') || null; }
function canReport(n) { return !!n && n.type === 'task' && isLeaf(n) && canWork(n) && !DONE(n.status) && !pendingReport(n.id); }
function validateReport(nodeId, data) {
  const errors = [];
  if (!RESULT[data.result]) errors.push('請選擇結果');
  if (!String(data.summary || '').trim()) errors.push('請填寫成果說明');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(data.finished_on || '')) errors.push('請填寫實際完成日');
  fieldDefs(nodeId).forEach((f) => {
    const raw = (data.values || {})[f.key];
    const empty = raw === undefined || raw === null || String(raw).trim() === '';
    if (f.required && empty) errors.push(`請填寫「${f.label}」`);
    else if (!empty && f.type === 'number' && !Number.isFinite(Number(raw))) errors.push(`「${f.label}」必須是數字`);
    else if (!empty && f.type === 'select' && !(f.options || []).includes(String(raw))) errors.push(`「${f.label}」的選項不正確`);
  });
  (data.files || []).forEach((x) => { if (x.size > MAX_FILE) errors.push(`「${x.name}」超過 10 MB`); });
  return errors;
}
function buildReport(nodeId, data) {

  return {
    id: newId('r'), node_id: nodeId, version: prev.length ? Math.max(...prev.map((r) => r.version)) + 1 : 1,
    result: data.result, summary: String(data.summary).trim(), finished_on: data.finished_on,
    // 標籤與單位存快照：欄位定義之後被改，舊回報仍讀得懂
    fields: fieldDefs(nodeId).map((f) => {
      const raw = (data.values || {})[f.key];
      const value = raw === undefined || raw === null || String(raw).trim() === '' ? null : f.type === 'number' ? Number(raw) : String(raw);
      return { key: f.key, label: f.label, value, unit: f.unit || '' };

}
// 一次使用者操作只留一筆復原：把 mark 之後新增的復原紀錄併入第一筆（保留最早的快照與標籤）

async function submitReport(nodeId, data, opts = {}) {

  const errors = validateReport(nodeId, data);

  const hard = findBlockers(n, 'review').filter((b) => b.hard);

  }

// 標為已完成的硬性阻擋（前置、未完成子任務），回傳說明文字

  const why = String(comment || '').trim();

  if (ok && !isLeaf(n)) { toast('此任務已有子任務，不能用完成回報確認完成', 'warn'); return false; }
  if (ok) {

/* ---------- 筆記 ---------- */

/* ---------- 附件 ---------- */
async function sha256Hex(blob) {
  try {
    const buf = await crypto.subtle.digest('SHA-256', await blob.arrayBuffer());
    return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
  } catch (e) { return ''; }
}

    added.push({ id, node_id: nodeId, report_id: link.reportId || null, note_id: link.noteId || null, filename: f.name, mime: f.type || 'application/octet-stream', size: f.size, sha256: await sha256Hex(f), storage_key: id, uploaded_by: ui.me, uploaded_at: nowStr(), deleted_at: null });
  }

/* ---------- 跳過整個任務 ---------- */

  if (!n || n.type !== 'task' || DONE(n.status)) return { ok: false, error: '這個任務不能跳過' };
  if (!why) return { ok: false, error: '請填寫理由' };
  if (pendingSkip(id)) return { ok: false, error: '已有待審核的跳過申請' };
  const tg = skipTargets(n);
  const rec = { id: newId('o'), kind: 'task', node: id, to: 'skipped', blockers: [`跳過整個任務${tg.length > 1 ? `（含 ${tg.length - 1} 項未完成子任務）` : ''}`], depIds: [], reason: why, by: ui.me, at: nowStr() };
  if (can('override', n)) {
    commit(`跳過「${n.title}」`, () => { db.overrides.unshift({ ...rec, status: 'approved', decidedBy: ui.me, decidedAt: nowStr(), self: true }); applySkip(db.overrides[0]); });
    log(id, '跳過', `跳過「${n.title}」${tg.length > 1 ? `與 ${tg.length - 1} 項子任務` : ''}，理由：${why}`);
    announceUnlocks(n);
    return { ok: true, mode: 'skipped' };
  }
  if (!can('edit', n)) return { ok: false, error: '你的角色無權跳過此任務' };
  commit(`申請跳過「${n.title}」`, () => { db.overrides.unshift({ ...rec, status: 'pending' }); });
  log(id, '跳過申請', `申請跳過「${n.title}」，理由：${why}`);
  notify(`已送出跳過申請：「${n.title}」（整個任務）\n已通知：${approversFor(n).map(uname).join('、')}`, '跳過申請');
  return { ok: true, mode: 'requested' };
}
function restoreTask(id) {
  const n = node(id);
  if (!n || n.status !== 'skipped') return { ok: false, error: '這個任務沒有被跳過' };
  if (!can('override', n)) return { ok: false, error: '只有有覆寫權限的人可以恢復任務' };
  const o = skipRecordOf(id);
  // 恢復的是當初被跳過的那個任務：整批還原；只恢復連帶跳過的子任務：只動它自己
  const prev = !o ? { [id]: 'todo' } : o.node === id ? o.prev : { [id]: o.prev[id] };
  commit(`恢復「${n.title}」`, () => {
    Object.entries(prev).forEach(([k, st]) => { const x = node(k); if (x && x.status === 'skipped') x.status = st; });
    if (o && o.node === id) { o.restoredBy = ui.me; o.restoredAt = nowStr(); }
    for (let p = n.parent ? node(n.parent) : null; p && p.type !== 'project'; p = p.parent ? node(p.parent) : null) {
      if ((DONE(p.status) || p.status === 'review') && kids(p.id).some((c) => !DONE(c.status))) p.status = 'doing';
    }
  });
  log(id, '恢復', `恢復「${n.title}」，回到跳過前的狀態`);
  return { ok: true };
}

<script>
/* ================= 共用 UI ================= */

const av = (id, size = 24) => `<span class="avatar av" style="width:${size}px;height:${size}px;background:${USERS[id] ? USERS[id].color : '#999'};color:#fff" title="${esc(uname(id))}">${esc(USERS[id] ? USERS[id].short : '?')}</span>`;

function openDlg(html, cls = '') { const d = $('dlg'); d.className = cls; d.innerHTML = html; if (!d.open) d.showModal(); return d; }
function closeDlg() { const d = $('dlg'); if (d.open) d.close(); }
function go(page, extra = {}) { Object.assign(ui, { page }, extra); $('app').classList.remove('side-open'); render(); $('main').scrollTop = 0; }
function enter(id) {
  const n = node(id); if (!n) return; if (!can('view', n)) return toast('你沒有檢視此節點的權限', 'warn');
  // 子任務預設打開「紀錄」；回到上層時從「紀錄」改回「看板」
  if (n.type === 'task' && isLeaf(n)) ui.tab = 'records'; else if (ui.tab === 'records') ui.tab = 'board';
  ui.page = 'node'; ui.node = id; ui.gsel = null; ui.connect = null; $('app').classList.remove('side-open'); render();

}

/* ================= 主渲染 ================= */
function render() { renderNav(); renderProjects(); renderMe(); renderMain(); renderAIHead(); renderChat(); }

function pendingCount() {

}
function renderNav() {

    ['overview', '所有專案總覽', '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>'],
    ['mytasks', '我的任務', '<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>'],
    ['review', '審核中心', '<path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/><path d="M9 12l2 2 4-4"/>'],

    ['templates', '模板庫', '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>'],
    ['aigov', 'AI 政策與稽核', '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>'],
    ['audit', '活動與稽核紀錄', '<path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h4"/>'],
  ];
  const pc = pendingCount();
  $('nav').innerHTML = items.map(([k, label, icon]) => `<button type="button" data-go="${k}" aria-current="${ui.page === k}">

    ${k === 'review' && pc ? `<span class="badge">${pc}</span>` : ''}</button>`).join('');
}
function renderProjects() {
  const cur = ui.page === 'node' && node(ui.node) ? projectOf(node(ui.node)).id : null;
  $('projectList').innerHTML = projects().filter(visible).map((p) => {

      <span class="pdot" style="background:${p.color}"></span>

function renderMe() {

function mbar() {
  return `<div class="mbar"><button class="btn sm" type="button" data-toggle-side>☰ 選單</button><button class="btn sm" type="button" data-toggle-ai>✦ AI 副手</button></div>`;
}
function renderMain() {
  const m = $('main');
  const pages = { overview: pageOverview, mytasks: pageMyTasks, review: pageReview, ops: pageOps, templates: pageTemplates, aigov: pageAIGov, audit: pageAudit, node: pageNode };
  const html = mbar() + (pages[ui.page] || pageNode)(); // 先產生內容：pageNode 可能把分頁從「紀錄」改成「看板」（D17）
  m.classList.toggle('scroll', ui.page !== 'node');
  // 節點頁的看板、時程、相依圖在自己的區塊內捲動；紀錄、文件、資料、成員分頁讓整個主區域上下捲動
  m.classList.toggle('vscroll', ui.page === 'node' && ['records', 'docs', 'data', 'people'].includes(ui.tab));
  m.innerHTML = html;
  if (getComputedStyle(m).overflowY === 'hidden') m.scrollTop = 0; // 主區域不能捲動時（桌面版的看板、時程、相依圖），不要停在紀錄等分頁捲動後的位置
  afterRender();

function afterRender() {
  if (ui.page === 'node' && ui.tab === 'timeline') drawArrows();

}

/* ================= 節點頁 ================= */
function pageNode() {
  let n = node(ui.node);
  if (!n || !can('view', n)) {
    n = projects().find(visible);

    ui.node = n.id;
  }
  const p = projectOf(n);
  const anc = ancestors(n);
  const [s, e] = span(n);
  const pc = Math.round(prog(n));
  const leafTask = n.type === 'task' && isLeaf(n);
  // 子任務新增第一個子任務或套用模板後變成上層任務，「紀錄」只剩唯讀彙總：改到看板，直接看到新的子任務（D17）
  if (ui.leafPage === n.id && !leafTask && ui.tab === 'records') ui.tab = 'board';
  ui.leafPage = leafTask ? n.id : null;
  const tabs = [['board', '看板'], ['timeline', '時程'], ['graph', '相依圖'], ['docs', '文件'], ['data', '資料'], ['people', '成員與權限'], ['records', '紀錄']];
  if (leafTask) tabs.unshift(tabs.pop()); // 子任務把「紀錄」放第一個
  const lvl = effLevel(n);
  const slip = n.type === 'project' ? slipOf(n.id) : null;
  const deep = depth(n) >= 5;
  let html = `<header class="head"><div style="min-width:0">
      <nav class="crumbs" aria-label="麵包屑">${anc.map((a) => `<button type="button" data-enter="${a.id}">${esc(a.title)}</button><span>/</span>`).join('')}<span class="cur">${esc(n.title)}</span></nav>
      <h1 class="serif">${n.milestone ? '◆ ' : ''}${esc(n.title)}</h1>
      <div class="meta">
        ${n.type === 'project' ? `<span>目標：${esc(n.goal || '—')}</span><span>預計上市：${ymd(n.due)}</span>` : n.type === 'task' ? `<span>負責：${whoHTML(n)}</span>` : `<span>負責人：${esc(uname(n.owner))}</span>`}
        <span>期間：${md(S(s))} – ${md(S(e))}</span>
        <span class="progress"><span class="track"><span style="width:${pc}%;background:${p.color}"></span></span><b>${pc}%</b></span>
        ${lvBadge(lvl)}
        ${slip && slip.days ? `<span class="tag warn">預估上市延後 ${slip.days} 天</span>` : slip ? '<span class="tag">預估如期上市</span>' : ''}
        ${n.type !== 'project' ? `<span class="tag gray">${STLBL[n.status]}</span>` : ''}
        ${deep ? '<span class="tag ai" title="README F1：超過 5 層時建議拆成獨立專案">層數較深，可考慮拆成獨立專案</span>' : ''}
      </div>
      ${n.note ? `<div class="note" style="margin-top:8px">${esc(n.note)}</div>` : ''}
      ${n.status === 'skipped' && !leafTask ? `<div class="note" style="margin-top:8px">⤳ 已跳過・${esc(skipInfo(n)).replace(/\n/g, '　')}</div>` : ''}
    </div>
    <div class="head-actions">
      <div class="members">${[...new Set([n.owner, ...n.collabs])].filter(Boolean).map((u) => `<span class="avatar" title="${esc(uname(u))}">${esc(USERS[u] ? USERS[u].short : u)}</span>`).join('')}</div>
      ${n.status === 'skipped' && can('override', n) && !leafTask ? `<button class="btn" type="button" data-restore="${n.id}">恢復任務</button>` : ''}
      ${n.type !== 'project' ? `<button class="btn" type="button" data-edit="${n.id}">編輯</button>` : ''}
      <button class="btn" type="button" data-save-tpl="${n.id}" ${isLeaf(n) || !can('create', n) ? 'disabled' : ''}>另存為模板</button>
      <button class="btn" type="button" data-apply-tpl="${n.id}" ${can('create', n) ? '' : 'disabled'}>套用模板</button>

  if (leafTask) html += reportCardHTML(n);

      <label><input type="checkbox" id="cascadeChk" ${ui.cascade ? 'checked' : ''}>後續相依自動順延</label>
      <button class="btn sm" type="button" data-crit aria-pressed="${ui.crit}">關鍵路徑</button>

    data: `<button class="btn sm" type="button" data-add-link="${n.id}" ${can('edit', n) ? '' : 'disabled'}>＋ 關聯營運資料</button>`,
    people: '',
    records: '',
  };
  html += `<div class="toolbar"><div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button class="tab" role="tab" type="button" data-tab="${k}" aria-selected="${ui.tab === k}">${l}</button>`).join('')}</div>

}

function phasesStrip(p) {
  const cur = currentPhase(p);
  return `<section class="phases" aria-label="開發階段與閘門">${kids(p.id).filter((k) => k.type === 'phase').map((ph) => {
    const g = db.gates[ph.id] || {};
    const ok = g.status === 'approved', ov = g.status === 'overridden';
    const pc = Math.round(prog(ph));

    return `<button class="phase ${isCur ? 'cur' : ''}" type="button" data-enter="${ph.id}" title="點擊進入此階段">
      <div class="bar"><span style="width:${pc}%;background:${ok || ov ? p.color : '#E8A77F'}"></span></div>
      <div class="row"><span class="nm">${esc(ph.title)}</span><span class="small muted">${pc}%</span></div>
      <div class="row"><span class="gate ${ok ? 'ok' : ov ? 'ov' : ''}">${ok ? '✓ 閘門已核准' : ov ? '⤳ 閘門已覆寫' : isCur ? '● 目前階段' : '○ 閘門未過'}</span></div>
    </button>`;
  }).join('')}</section>`;
}
function gateInline(ph) {
  const g = db.gates[ph.id];
  const met = gateCriteriaMet(ph);
  const st = { approved: '✓ 已核准', overridden: '⤳ 已覆寫通過', pending: '待核准' }[g.status];
  return `<section class="panel row" style="justify-content:space-between">
    <div><b>階段閘門</b>　<span class="muted">${esc(g.criteria)}</span><br><span class="small muted">審核人：${esc(g.approver)}　完成標準：${met ? '<span class="check">✓ 本階段任務皆完成</span>' : '<span class="cross">✗ 尚有任務未完成</span>'}</span></div>
    <div class="row"><span class="tag ${g.status === 'pending' ? 'gray' : ''}">${st}</span><button class="btn sm" type="button" data-gate="${ph.id}">閘門審核</button></div>
  </section>`;
}

/* ---------- 看板 ---------- */
function blockersFor(c) { return c.status === 'todo' ? findBlockers(c, 'doing') : []; }
function cardHTML(c, ctx) {
  const k = kids(c.id).filter(visible);
  const bl = blockersFor(c);
  const hard = bl.filter((b) => b.hard), soft = bl.filter((b) => !b.hard);
  const late = isLate(c);
  const [s, e] = span(c);
  const ph = ctx.type === 'project' ? phaseOf(c) : null;
  const pc = Math.round(prog(c));
  const ex = ui.expanded['b' + c.id];
  return `<article class="card ${late ? 'late' : ''}" draggable="${can('edit', c) && c.status !== 'skipped'}" data-id="${c.id}">
    <div class="tags">${ph ? `<span class="tag gray">${esc(ph.title)}</span>` : ''}${c.tag ? `<span class="tag">${esc(c.tag)}</span>` : ''}
      ${c.milestone ? '<span class="tag blue">◆ 里程碑</span>' : ''}${c.ai ? '<span class="tag ai">AI 建議</span>' : ''}
      ${late ? '<span class="tag warn">延遲</span>' : ''}${effLevel(c) === 'confidential' ? lvBadge('confidential') : ''}
      ${hard.length ? `<span class="tag warn" title="${esc(hard.map((b) => b.text).join('\n'))}">🔒 等待前置</span>` : ''}
      ${soft.length ? `<span class="tag ai" title="${esc(soft.map((b) => b.text).join('\n'))}">⚠ 軟性前置</span>` : ''}
      ${pendingReport(c.id) ? '<span class="tag blue">待確認回報</span>' : ''}
      ${c.status === 'skipped' ? `<span class="tag gray" title="${esc(skipInfo(c))}">⤳ 已跳過</span>` : ''}
      ${pendingSkip(c.id) ? '<span class="tag ai">跳過申請中</span>' : ''}</div>
    <button class="ctitle" type="button" data-enter="${c.id}">${esc(c.title)}</button>
    ${hard.length ? `<div class="small muted">等待：${esc(hard.map((b) => b.dep && b.dep.cond ? b.dep.cond.label : (b.dep ? node(b.dep.from)?.title : b.text)).join('、'))}</div>` : ''}
    ${k.length ? `<div class="mini"><span>${k.filter((x) => DONE(x.status)).length}/${k.length} 子任務</span><span class="track"><span style="width:${pc}%"></span></span><span>${pc}%</span>
      <button class="iconbtn" type="button" data-expand="${c.id}" aria-expanded="${!!ex}">${ex ? '收合' : '展開'}</button></div>` : ''}

    const [fs, fe] = span(x), [ts, te] = span(t);
    const need = d.type === 'FS' ? fe + d.lag + 1 - ts : d.type === 'SS' ? fs + d.lag - ts : fe + d.lag - te;
    if (need <= 0) return;
    if (t.locked) { notify(`時程順延碰到已鎖定的里程碑「${t.title}」，需要 ${need} 天，請專案負責人決定是否調整。`, '時程警示'); return; }
    shiftSubtree(t, need);
    if (!moved.includes(t.id)) moved.push(t.id);
    cascadeFrom(t.id, moved, lvl + 1);
  }));
}

/* ---------- 相依圖（F4） ---------- */
// 只放葉節點；掛在上層任務的相依，轉成「上層最晚結束的子任務 → 下層最早開始的子任務」
const GW = 200, GH = 58, GCOL = 260, GROW = 80;
function graphLayout(n) {
  const leaves = descendants(n.id).filter((x) => visible(x) && isLeaf(x));
  const L = new Set(leaves.map((x) => x.id));
  const sub = new Set(descendants(n.id).map((x) => x.id));
  const ends = (id, first) => {
    const x = node(id);
    if (isLeaf(x)) return L.has(id) ? [id] : [];
    const ls = descendants(id).filter((y) => L.has(y.id));
    if (!ls.length) return [];
    const key = (y) => (first ? span(y)[0] : span(y)[1]);
    const best = first ? Math.min(...ls.map(key)) : Math.max(...ls.map(key));
    return ls.filter((y) => key(y) === best).map((y) => y.id);
  };
  const edges = [], seen = new Set();
  db.deps.forEach((d) => {
    if (d.cond || !sub.has(d.from) || !sub.has(d.to)) return;
    ends(d.from, d.type === 'SS').forEach((f) => ends(d.to, true).forEach((t) => {
      const k = f + '>' + t;
      if (f === t || seen.has(k)) return;
      seen.add(k); edges.push({ d, from: f, to: t });
    }));
  });
  const lvl = {}; leaves.forEach((x) => { lvl[x.id] = 0; });
  for (let i = 0; i < leaves.length; i++) {
    let ch = false;
    edges.forEach((e) => { if (lvl[e.to] < lvl[e.from] + 1) { lvl[e.to] = lvl[e.from] + 1; ch = true; } });
    if (!ch) break;
  }
  const cols = {};
  leaves.slice().sort((a, b) => span(a)[0] - span(b)[0] || a.order - b.order).forEach((x) => { (cols[lvl[x.id]] = cols[lvl[x.id]] || []).push(x); });
  const pos = {};
  Object.entries(cols).forEach(([c, list]) => list.forEach((x, i) => { pos[x.id] = { x: 24 + c * GCOL, y: 24 + i * GROW, c: +c }; }));
  return { shown: leaves, edges, pos };
}
function viewGraph(n) {
  const { shown, pos } = graphLayout(n);
  if (!shown.length) return '<div class="panel empty">沒有可顯示的任務。</div>';
  const crit = ui.crit ? criticalPath(n.id) : { nodes: new Set() };
  const W = Math.max(...Object.values(pos).map((p) => p.x)) + GW + 40, H = Math.max(...Object.values(pos).map((p) => p.y)) + GH + 30;
  return `<div class="graph" id="graph"><div style="position:relative;width:${W}px;height:${H}px">
    <svg class="arrows" id="garrows" width="${W}" height="${H}"></svg>
    ${shown.map((x) => {
      const bl = blockersFor(x).filter((b) => b.hard);
      const [s, e] = span(x);
      const path = ancestors(x).filter((a) => depth(a) > depth(n)).map((a) => a.title).join(' › ');
      return `<div class="gnode ${ui.gsel === x.id ? 'sel' : ''} ${crit.nodes.has(x.id) ? 'crit' : ''} ${DONE(x.status) ? 'done' : ''}" data-gnode="${x.id}" style="left:${pos[x.id].x}px;top:${pos[x.id].y}px" title="${esc(path ? path + ' › ' : '')}${esc(x.title)}">
        <span class="gmeta"><span class="dot ${x.status}"></span><span>${x.milestone ? md(S(s)) : `${md(S(s))}–${md(S(e))}`}</span>${bl.length ? '<span class="tag warn">🔒</span>' : ''}<span class="gpath">${esc(path)}</span></span>
        <b>${x.milestone ? '◆ ' : ''}${esc(x.title)}</b></div>`;
    }).join('')}</div></div>
    <p class="small muted">由左到右依前後順序排列，箭頭只往右推進。灰色實線＝已滿足；橘色虛線＝未滿足；深橘粗線＝關鍵路徑。${can('deps', n) ? '按「＋ 建立相依連線」後依序點「前置 → 後續」即可建立（預設：完成→開始、硬性），系統會阻擋循環相依。' : '你的角色無權設定前置條件。'}點方塊可編輯。</p>`;
}
function drawGraphEdges() {
  const svg = $('garrows'); if (!svg) return;
  const n = node(ui.node);
  const { edges, pos } = graphLayout(n);
  const crit = ui.crit ? criticalPath(n.id) : { nodes: new Set() };
  let normal = '', critical = '';
  edges.forEach(({ d, from, to }) => {
    const A = pos[from], B = pos[to];
    const x1 = A.x + GW, y1 = A.y + GH / 2, x2 = B.x, y2 = B.y + GH / 2;
    const g1 = x1 + (GCOL - GW) / 2, g2 = x2 - (GCOL - GW) / 2;
    let pts;
    if (B.c - A.c <= 1 || y1 === y2 && B.c - A.c <= 1) pts = y1 === y2 ? [[x1, y1], [x2, y2]] : [[x1, y1], [g1, y1], [g1, y2], [x2, y2]];
    else { const lane = B.y - (GROW - GH) / 2; pts = [[x1, y1], [g1, y1], [g1, lane], [g2, lane], [g2, y2], [x2, y2]]; }
    const isCrit = crit.nodes.has(from) && crit.nodes.has(to);
    if (isCrit) critical += arrowSVG('ga', pts, d, true); else normal += arrowSVG('ga', pts, d, false);
  });
  svg.innerHTML = arrowDefs('ga') + normal + critical;
}

function deptUsage(id) {

const deptAdminErr = () => (me().role === 'admin' ? null : '只有系統管理員可以管理部門');
function addDept(name) {
  const err = deptAdminErr(); if (err) return { ok: false, error: err };

  if (!nm) return { ok: false, error: '請填寫部門名稱' };
  if (db.departments.some((d) => d.name === nm)) return { ok: false, error: '已有同名部門' };

  log(null, '部門', `新增部門「${nm}」`);

}
function updateDept(id, { name, head }) {
  const err = deptAdminErr(); if (err) return { ok: false, error: err };
  const d = dept(id); if (!d) return { ok: false, error: '找不到部門' };

function maskText(text) {
  const map = []; const cnt = {};

  let out = text;
  db.ops.suppliers.flatMap((s) => [s.name, s.short]).sort((a, b) => b.length - a.length).forEach((nm) => { if (out.includes(nm)) out = out.split(nm).join(put('廠商', nm)); });

  out = out.replace(/\d+(\.\d+)?\s?%/g, (m) => put('比例', m));

function nodeToTemplate(id, name) {
  const root = node(id); const [r0] = span(root);
  const nodes = [], keys = {};
  const walk = (x, pk) => {
    const k = 'k' + nodes.length; keys[x.id] = k;
    const [a, b] = span(x);
    nodes.push({ k: pk === null ? 'r' : k, p: pk, title: x.title, tag: x.tag, off: a - r0, dur: b - a, who: x.owner, dp: x.depts, ms: x.milestone,
      fields: fieldDefs(x.id).map(({ label, type, unit, options, required }) => ({ label, type, unit, options, required })) });
    if (pk === null) keys[x.id] = 'r';
    kids(x.id).forEach((c) => walk(c, keys[x.id]));
  };
  walk(root, null);
  const deps = db.deps.filter((d) => !d.cond && keys[d.from] && keys[d.to]).map((d) => ({ f: keys[d.from], t: keys[d.to], type: d.type, lag: d.lag }));
  return { id: 'tmp', name: name || root.title, scope: 'personal', version: 1, history: [], nodes, deps, docs: [] };
}
function applyTemplate(t, parentId, opt) {
  const start = D(opt.start);
  const sub = (s) => s.replace(/\{(.+?)\}/g, (m, k) => opt.vars[k] ?? m);
  const map = {};
  const list = opt.structure ? t.nodes : t.nodes.filter((x) => x.p === null);
  list.forEach((x) => {
    const par = x.p === null ? parentId : map[x.p];
    const s = opt.dates ? start + x.off : start, e = opt.dates ? s + x.dur : start;
    map[x.k] = addNode(par, { title: sub(x.title), tag: x.tag, start: S(s), end: S(Math.max(s, e)), owner: opt.owners && x.who ? x.who : ui.me, depts: opt.owners ? (x.dp || []) : [], milestone: !!x.ms });
    (x.fields || []).forEach((f, i) => pushField(map[x.k], f, i));
  });
  if (opt.deps && opt.structure) t.deps.forEach((d) => { if (map[d.f] && map[d.t] && d.f !== 'r' && d.t !== 'r') db.deps.push({ id: newId('d'), from: map[d.f], to: map[d.t], type: d.type, lag: d.lag, enf: 'hard', cond: null, overridden: false }); });
  if (opt.docs) (t.docs || []).forEach((title) => db.docs.push({ id: newId('doc'), node: map.r || map[t.nodes[0].k], title: sub(title), level: 'internal', versions: [{ v: 1, by: ui.me, at: ymd(TODAY), body: `# ${sub(title)}\n\n（由模板「${t.name}」建立的文件範本）` }] }));
  return { root: map.r || map[t.nodes[0].k], count: Object.keys(map).length };
}

function mdHTML(s) {
  return esc(s).split('\n').map((l) => {
    const b = l.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    if (/^### /.test(l)) return `<h3>${b.slice(4)}</h3>`;
    if (/^## /.test(l)) return `<h2>${b.slice(3)}</h2>`;
    if (/^# /.test(l)) return `<h1>${b.slice(2)}</h1>`;
    if (/^- /.test(l)) return `<ul><li>${b.slice(2)}</li></ul>`;
    return l.trim() ? `<p style="margin:4px 0">${b}</p>` : '';
  }).join('').replace(/<\/ul><ul>/g, '');
}

function createProject(name, pet, due) {
  closeDlg();

  aiRun('建立新專案', 'public', `依寵物罐頭開發範本建立專案：${name}（${pet}），上市 ${due}`, () => ({ text: `已依範本產生「${name}」：5 個階段、${PHASE_TEMPLATE.reduce((a, t) => a + t[3].length, 0)} 項初版任務與階段閘門。所有任務標示「AI 建議」，請檢查後調整。` }));
  commit(`建立專案「${name}」`, () => {
    pid = newId('p');
    const s0 = T0, e0 = Math.max(D(due), T0 + 60), step = Math.floor((e0 - s0) / 5);
    const colors = ['#7A4A8C', '#A0522D', '#2E6F8E', '#6B7A3A'];
    db.nodes[pid] = { id: pid, parent: null, type: 'project', title: name, tag: '', status: 'todo', progress: null, weight: 1, start: TODAY, end: due, milestone: false, locked: false, owner: ui.me, collabs: [], depts: [], level: 'internal', ai: false, note: '', links: [], order: 100 + projects().length, color: colors[projects().length % colors.length], goal: `為${pet}開發的新品：${name}`, due };
    let prevLast = null;
    PHASE_TEMPLATE.forEach(([title, crit, appr, tasks], i) => {
      const ph = newId('n');
      const ps = s0 + i * step, pe = i === 4 ? e0 : ps + step - 1;
      db.nodes[ph] = { ...clone(db.nodes[pid]), id: ph, parent: pid, type: 'phase', title, start: S(ps), end: S(pe), color: undefined, goal: undefined, due: undefined, level: null, order: i };
      db.gates[ph] = { criteria: crit, approver: appr, status: 'pending' };
      const len = Math.max(3, Math.floor(step / tasks.length));
      let prev = null;
      tasks.forEach((t, k) => {
        const id = addNode(ph, { title: t, ai: true, start: S(ps + k * len), end: S(Math.min(pe, ps + (k + 1) * len - 1)), tag: TAGS.find((g) => t.includes(g)) || '' });
        if (prev) db.deps.push({ id: newId('d'), from: prev, to: id, type: 'FS', lag: 0, enf: 'soft', cond: null, overridden: false });
        else if (prevLast) db.deps.push({ id: newId('d'), from: prevLast, to: id, type: 'FS', lag: 0, enf: 'soft', cond: null, overridden: false });
        prev = id;
      });
      prevLast = prev;
    });
  });
  log(pid, '專案', `以 AI 精靈建立專案「${name}」`);
  enter(pid);
}

function poNext(id) {
  const po = db.ops.pos.find((p) => p.id === id);
  const nx = PO_FLOW[PO_FLOW.indexOf(po.status) + 1]; if (!nx) return;
  const before = db.deps.filter((d) => d.cond && d.cond.id === id);
  commit(`${id} → ${nx}`, () => {
    po.status = nx;
    if (nx === '下單' && !po.ordered) po.ordered = TODAY;
    if (nx === '到貨') { po.received = TODAY; po.items.forEach((i, k) => { if (!i.lot) i.lot = `L-${i.m.slice(2)}-${TODAY.slice(5).replace('-', '')}${k ? '-' + k : ''}`; }); }
  });

  if (nx === '驗收') {
    before.forEach((d) => {
      const t = node(d.to); if (!t) return;
      const free = findBlockers(t, 'doing').filter((b) => b.hard);
      notify(`${id} 到貨驗收完成，「${t.title}」的前置條件「${d.cond.label}」已滿足。${free.length ? `\n仍在等待：${free.map((b) => b.text).join('；')}` : '\n此任務現在可以開始，已通知 ' + uname(t.owner) + '。'}`, '事件驅動');
    });

  }
}
function woNext(id) {

function erpSync() {
  const before = slipOf('p1').days;
  const changes = [];
  commit('ERP 同步', () => {
    if (!db.erpSynced) {
      const po = db.ops.pos.find((p) => p.id === 'PO-2604');
      if (po && po.status !== '驗收') { changes.push(`PO-2604 交期由 ${md(po.expected)} 延到 10/22（供應商通知）`); po.expected = '2026-10-22'; po.synced = nowStr(); }
    }
    db.ops.suppliers.forEach((s) => {
      s.synced = s.source === 'erp' ? nowStr() : s.synced;
      if (D(s.cert) - T0 < 60 && !Object.values(db.nodes).some((n) => n.certFor === s.id)) {
        const id = addNode('p4', { title: `更新證照：${s.short}（${md(s.cert)} 到期）`, tag: '採購', owner: 'hua', dept: USERS.hua.dept, start: TODAY, end: S(D(s.cert) - 14), links: [{ t: 'supplier', id: s.id }] });
        db.nodes[id].certFor = s.id;
        changes.push(`${s.short} 證照 ${md(s.cert)} 到期，已自動建立更新任務給阿華`);
      }
    });
    db.erpSynced = (db.erpSynced || 0) + 1;
  });
  audit.sync.unshift({ at: nowStr(), module: '供應商、原料、採購單', dir: 'pull', records: 20, errors: 0, status: changes.length ? `成功（${changes.length} 項異動）` : '成功（無異動）' });
  save();
  const after = slipOf('p1').days;
  log(null, 'ERP 同步', changes.length ? changes.join('；') : '同步完成，無異動', 'it');
  notify(changes.length ? `ERP 同步完成：\n· ${changes.join('\n· ')}${after !== before ? `\n\n⚠ PO-2604 是「加速保存試驗」的前置條件，位於關鍵路徑上：預估上市延後由 ${before} 天變為 ${after} 天。` : ''}` : 'ERP 同步完成，沒有異動。', 'ERP 同步');
  render();
}

function openSkipDialog(id) {
  const n = node(id);
  if (!n || n.type !== 'task' || DONE(n.status)) return toast('這個任務不能跳過', 'warn');
  const canOv = can('override', n);
  if (!canOv && !can('edit', n)) return toast('你的角色無權跳過此任務', 'warn');
  if (pendingSkip(id)) return toast('已有待審核的跳過申請', 'warn');
  const tg = skipTargets(n);
  const fam = new Set(tg.map((x) => x.id));
  const unlock = [...new Set(db.deps.filter((d) => fam.has(d.from) && !fam.has(d.to) && node(d.to) && !DONE(node(d.to).status)).map((d) => node(d.to).title))];
  openDlg(`<form id="skipForm" data-id="${id}"><h2 class="serif">⤳ 跳過任務：${esc(n.title)}</h2>
    <p style="margin-top:-6px">以下 ${tg.length} 項會標為「已跳過」，進度算 100%：</p>
    <div class="listpick">${tg.map((x) => `<label><span class="dot ${x.status}"></span>${esc(x.title)}<span class="muted" style="margin-left:auto">${STLBL[x.status]}</span></label>`).join('')}</div>
    ${unlock.length ? `<div class="small muted" style="margin-top:8px">可能解鎖的後續任務：${esc(unlock.join('、'))}</div>` : ''}
    <div class="note" style="margin-top:12px">${canOv ? '你有覆寫權限，會直接跳過並寫入稽核紀錄；之後可在任務頁按「恢復任務」。' : `你的角色（${ROLES[me().role]}）無法自行跳過，會送出跳過申請給：${esc(approversFor(n).map(uname).join('、'))}。`}</div>
    <div class="field" style="margin-top:12px"><label for="sReason">理由（必填）</label><textarea id="sReason" style="min-height:80px" placeholder="例如：客戶取消此規格，這項測試不需要做了"></textarea></div>

  }
  if (t.id === 'moveTo' && t.value) { const id = $('edForm').dataset.id; closeDrawer(); return moveNode(id, t.value); }
  if (t.id === 'tSel') return openApplyTpl(ui.tplState.nodeId, t.value, 'tpl');
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'dBody') $('dPrev').innerHTML = mdHTML(e.target.value);
  if (e.target.id === 'pastQ') { const q = e.target.value; clearTimeout(window._pq); window._pq = setTimeout(() => { openApplyTpl(ui.tplState.nodeId, null, 'past', q); const i = $('pastQ'); i.focus(); i.setSelectionRange(q.length, q.length); }, 250); }
});
document.addEventListener('submit', (e) => {
  const f = e.target; e.preventDefault();
  if (f.id === 'askForm') { const q = $('askInput').value.trim(); if (!q) return; $('askInput').value = ''; return aiAsk(q); }
  if (f.id === 'edForm') return saveEditor(f.dataset.id);
  if (f.id === 'deptForm') return submitDept(f.dataset.id);
  if (f.id === 'qaForm') {
    const title = $('qTitle').value.trim(); if (!title) return;
    let s = $('qS').value || TODAY, en = $('qE').value || s; if (D(en) < D(s)) en = s; if ($('qMs').checked) en = s;
    const chain = $('qChain') && $('qChain').checked ? f.dataset.prev : null;
    const more = e.submitter && e.submitter.value === 'more';
    const tag = $('qTag').value, owner = $('qWho').value || null, ms = $('qMs').checked;
    closeDlg();
    const id = commit(`新增「${title}」`, () => {
      const nid = addNode(f.dataset.parent, { title, tag, owner, start: s, end: en, milestone: ms });
      if (chain && node(chain)) db.deps.push({ id: newId('d'), from: chain, to: nid, type: 'FS', lag: 0, enf: 'hard', cond: null, overridden: false });
      return nid;
    });
    log(id, '新增', `新增任務「${title}」，${node(id).owner ? `指派給 ${uname(node(id).owner)}` : '未指派'}${chain ? `，接在「${node(chain).title}」之後` : ''}`);
    if (more) { const dur = D(en) - D(s); const names = [...(ui.qaNames || []), title]; return openQuickAdd(f.dataset.parent, S(D(en) + 1), S(D(en) + 1 + dur), { prev: id, owner, tag, added: names.length, names }); }
    return toast(`已新增「${title}」`, null, { label: '復原', fn: undo });
  }
  if (f.id === 'skipForm') { const r = skipTask(f.dataset.id, $('sReason').value); if (!r.ok) return toast(r.error, 'warn'); closeDlg(); return toast(r.mode === 'skipped' ? '已跳過任務' : '已送出跳過申請'); }
  if (f.id === 'reportForm') {
    const nid = f.dataset.node; const n = node(nid);
    const data = {
      result: (document.querySelector('input[name="rResult"]:checked') || {}).value,
      summary: $('rSummary').value, finished_on: $('rDate').value,
      values: Object.fromEntries(fieldDefs(nid).map((d) => [d.key, $('rv_' + d.key).value])),
      files: [...($('rFiles').files || [])],
    };
    const self = !!e.submitter && e.submitter.value === 'self';
    submitReport(nid, data, { selfApprove: self }).then((r) => {
      if (r.ok) { closeDlg(); return toast(self ? '已送出並確認完成' : '已送出完成回報，等待確認'); }
      if (r.blocked) { closeDlg(); return openBlockDialog(n, 'doing', findBlockers(n, 'doing')); }
      toast(r.errors.join('；'), 'warn');
    });
    return;
  }
  if (f.id === 'rejectForm') { if (decideReport(f.dataset.report, false, $('rjComment').value)) { closeDlg(); toast('已退回完成回報'); } return; }
  if (f.id === 'noteForm') {
    const files = [...($('nFiles') && $('nFiles').files || [])];
    if (files.some((x) => x.size > MAX_FILE)) return toast('有檔案超過 10 MB，請移除後再送出', 'warn');
    const r = addNote(f.dataset.node, $('nBody').value);
    if (!r.ok) return toast(r.error, 'warn');
    if (files.length) addAttachments(f.dataset.node, files, { noteId: r.note.id }).then((x) => { if (x.errors.length) toast(x.errors.join('；'), 'warn'); });
    return toast('已新增筆記');
  }
  if (f.id === 'noteEditForm') { const r = editNote(f.dataset.note, $('neBody').value); if (!r.ok) return toast(r.error, 'warn'); closeDlg(); return toast('已修改筆記'); }
  if (f.id === 'attForm') {
    const files = [...($('aFiles').files || [])];
    if (!files.length) return toast('請先選擇檔案', 'warn');
    addAttachments(f.dataset.node, files).then((x) => toast(x.errors.length ? x.errors.join('；') : `已上傳 ${x.added.length} 個附件`, x.errors.length ? 'warn' : undefined));
    return;
  }
  if (f.id === 'blockForm') { const r = $('bReason').value.trim(); if (!r) return toast('請填寫理由', 'warn'); return submitBlock(f.dataset.id, f.dataset.to, r); }
  if (f.id === 'gateForm') return submitGate(f.dataset.id, e.submitter ? e.submitter.value : 'approve');
  if (f.id === 'tplForm') return submitTpl(f.dataset.node);
  if (f.id === 'saveTplForm') { const nm = $('stName').value.trim(); if (nm) submitSaveTpl(f.dataset.id, nm); return; }
  if (f.id === 'docForm') return saveDoc(f.dataset.doc, f.dataset.node);
  if (f.id === 'npForm') { const nm = $('npName').value.trim(); if (nm) createProject(nm, $('npPet').value, $('npDue').value || '2027-09-30'); return; }
  if (f.id === 'minForm') return runMinutes($('minText').value);
  if (f.id === 'minConfirm') {
    const { items, done } = ui.minItems; const par = $('minParent').value; const pick = [...document.querySelectorAll('.minItem:checked')].map((x) => items[+x.value]);
    closeDlg();
    commit('建立會議待辦', () => pick.forEach((x) => addNode(par, { title: x.title, owner: x.owner, dept: USERS[x.owner] ? USERS[x.owner].dept : undefined, start: S(Math.min(T0 + 1, D(x.due))), end: x.due, ai: true })));
    log(par, 'AI', `從會議紀錄建立 ${pick.length} 項待辦`); done(); return toast(`已建立 ${pick.length} 項子任務`, null, { label: '查看', fn: () => enter(par) });
  }
  if (f.id === 'impForm') {
    const rows = parseImport($('impText').value).filter((r) => r.st === '新增'); closeDlg();
    commit('匯入供應商', () => rows.forEach((r) => db.ops.suppliers.push({ id: r.id, ext: '', name: r.name, short: r.name.slice(0, 4), items: r.items, status: '候選', contact: '', rating: '-', cert: '2027-12-31', evals: [], source: 'native', synced: '' })));
    log(null, '匯入', `匯入 ${rows.length} 筆供應商`); return toast(`已匯入 ${rows.length} 筆，重複與格式錯誤已略過`);
  }
  if (f.id === 'linkForm') {
    const [tp, id] = $('linkSel').value.split('|'); const n = node(f.dataset.node);
    const link = tp === 'formula' ? { t: 'formula', id: id.split(':')[0], v: +id.split(':')[1] } : { t: tp, id };
    closeDlg(); commit('關聯營運資料', () => { n.links = [...(n.links || []).filter((l) => !(l.t === link.t && l.id === link.id && l.v === link.v)), link]; }); return log(n.id, '關聯', `關聯 ${link.id}${link.v ? ' v' + link.v : ''}`);
  }
  if (f.id === 'traceForm') { ui.trace = $('traceInput').value; return render(); }
});

/* 看板拖曳 */
let dragId = null;
document.addEventListener('dragstart', (e) => { const c = e.target.closest && e.target.closest('.card'); if (!c) return; dragId = c.dataset.id; c.classList.add('dragging'); e.dataTransfer.setData('text/plain', dragId); e.dataTransfer.effectAllowed = 'move'; });
document.addEventListener('dragend', () => { dragId = null; document.querySelectorAll('.dragging,.over,.nest').forEach((x) => x.classList.remove('dragging', 'over', 'nest')); });
document.addEventListener('dragover', (e) => {
  const col = e.target.closest && e.target.closest('.column'); if (!col || !dragId) return;
  e.preventDefault();
  document.querySelectorAll('.over,.nest').forEach((x) => x.classList.remove('over', 'nest'));
  const card = e.target.closest('.card');
  if (card && card.dataset.id !== dragId) card.classList.add('nest'); else col.classList.add('over');
});
document.addEventListener('drop', (e) => {
  const col = e.target.closest && e.target.closest('.column'); if (!col || !dragId) return;
  e.preventDefault();
  const card = e.target.closest('.card'); const id = dragId; dragId = null;
  document.querySelectorAll('.over,.nest').forEach((x) => x.classList.remove('over', 'nest'));
  if (card && card.dataset.id !== id) return moveNode(id, card.dataset.id);
  setStatus(id, col.dataset.col);
});
/* 滑過卡片時高亮相依 */
document.addEventListener('mouseover', (e) => {
  const c = e.target.closest && e.target.closest('.card'); if (!c || c._hl) return;
  document.querySelectorAll('.card.hl,.card.hl-src').forEach((x) => { x.classList.remove('hl', 'hl-src'); x._hl = false; });
  const n = node(c.dataset.id); if (!n) return;
  const rel = new Set();
  [n, ...ancestors(n)].forEach((x) => incoming(x).forEach((d) => d.from && rel.add(d.from)));
  outgoing(n).forEach((d) => rel.add(d.to));
  if (!rel.size) return;
  c.classList.add('hl-src'); c._hl = true;
  document.querySelectorAll('.card').forEach((x) => { if (rel.has(x.dataset.id)) x.classList.add('hl'); });
});
document.addEventListener('mouseleave', (e) => { if (e.target.classList && e.target.classList.contains('card')) { document.querySelectorAll('.card.hl,.card.hl-src').forEach((x) => { x.classList.remove('hl', 'hl-src'); x._hl = false; }); } }, true);
/* 時程拖曳 */
document.addEventListener('pointerdown', (e) => { if (e.target.closest && e.target.closest('#tl') && e.button === 0) tlPointerDown(e); });
document.addEventListener('pointermove', tlPointerMove);
document.addEventListener('contextmenu', (e) => { const bar = e.target.closest && e.target.closest('#tl .gb'); if (!bar) return; e.preventDefault(); drag = null; openEditor(bar.dataset.bar); });
document.addEventListener('pointerup', tlPointerUp);
window.addEventListener('resize', () => { if (ui.page === 'node' && ui.tab === 'timeline') drawArrows(); });
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && !$('dlg').open && !$('drawer').open) { e.preventDefault(); undo(); }
});
$('drawer').addEventListener('click', (e) => { if (e.target === $('drawer')) closeDrawer(); });
$('dlg').addEventListener('click', (e) => { if (e.target === $('dlg')) closeDlg(); });

/* ================= 啟動 ================= */
load();
migrate();
ui.chat.push({ title: '歡迎', text: `這是依 README 規格（F1–F10）製作的完整互動 Demo，資料存在你的瀏覽器。\n\n可以試試：\n· 點卡片標題進入任一層（專案 → 階段 → 任務 → 子任務）\n· 時程拖曳移動 / 拉伸，勾選自動順延，按「關鍵路徑」\n· 用「阿明（成員）」把 🔒 任務拖到進行中 → 送出跳過申請\n· 任務頁「紀錄」分頁：回報完成、寫筆記、上傳附件；卡片上的 ⤳ 可以跳過整個任務\n· 營運資料 → ERP 同步 → 看交期延誤如何影響上市日\n· 左下角切換成「小林（行銷）」，看權限與機密欄位差異` });
render();
fileStore.check().then(() => render());
</script>
</body>
